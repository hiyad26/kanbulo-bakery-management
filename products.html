<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B4513">
  <title>Products - Kanbulo Bakery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #3b2415;
    }

    header {
      background: #8B4513;
      color: white;
      padding: 18px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .back {
      background: #eee;
      color: #333;
    }

    .add {
      background: #8B4513;
      color: white;
    }

    .form {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .form input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .save {
      width: 100%;
      background: #8B4513;
      color: white;
      margin-top: 8px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .product h3 {
      margin-bottom: 5px;
    }

    .price {
      font-weight: bold;
      color: #8B4513;
    }

    .delete {
      background: #f3d6d6;
      color: #a00000;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #888;
    }

    @media (max-width: 500px) {
      .product {
        flex-direction: column;
        align-items: flex-start;
      }

      .product button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Products</p>
</header>

<main>

  <div class="top">
    <button class="back" onclick="goBack()">← Dashboard</button>
    <button class="add" onclick="showForm()">＋ Add Product</button>
  </div>

  <div class="form" id="productForm">

    <h2>Add Product</h2>

    <input
      type="text"
      id="productName"
      placeholder="Product name"
    >

    <input
      type="number"
      id="productPrice"
      placeholder="Selling price"
      step="0.01"
    >

    <input
      type="number"
      id="productStock"
      placeholder="Opening stock"
      min="0"
    >

    <button class="save" onclick="addProduct()">
      Save Product
    </button>

  </div>

  <div id="productList"></div>

</main>

<script>

  const STORAGE_KEY = "kanbulo_products";

  function getProducts() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (error) {
      return [];
    }
  }

  function saveProducts(products) {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(products)
    );
  }

  function showForm() {
    document.getElementById("productForm").style.display = "block";
    document.getElementById("productName").focus();
  }

  function addProduct() {

    const name =
      document.getElementById("productName").value.trim();

    const price =
      Number(document.getElementById("productPrice").value);

    const stock =
      Number(document.getElementById("productStock").value);

    if (!name) {
      alert("Please enter a product name.");
      return;
    }

    if (!price || price < 0) {
      alert("Please enter a valid price.");
      return;
    }

    if (stock < 0 || isNaN(stock)) {
      alert("Please enter valid stock.");
      return;
    }

    const products = getProducts();

    products.push({
      id: Date.now(),
      name: name,
      price: price,
      stock: stock
    });

    saveProducts(products);

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productStock").value = "";

    document.getElementById("productForm").style.display = "none";

    displayProducts();
  }

  function deleteProduct(id) {

    if (!confirm("Delete this product?")) {
      return;
    }

    const products = getProducts();

    const updated =
      products.filter(product => product.id !== id);

    saveProducts(updated);

    displayProducts();
  }

  function displayProducts() {

    const list =
      document.getElementById("productList");

    const products = getProducts();

    if (products.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <h3>No products yet</h3>
          <p>Tap "Add Product" to add your first bakery product.</p>
        </div>
      `;
      return;
    }

    list.innerHTML = products.map(product => `
      <div class="product">

        <div>
          <h3>${escapeHTML(product.name)}</h3>
          <p class="price">
            MVR ${product.price.toFixed(2)}
          </p>
          <p>
            Stock: ${product.stock}
          </p>
        </div>

        <button
          class="delete"
          onclick="deleteProduct(${product.id})">
          Delete
        </button>

      </div>
    `).join("");
  }

  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

  function goBack() {
    window.location.href = "index.html";
  }

  displayProducts();

</script>

</body>
</html>
