```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B4513">

  <title>Kanbulo Bakery Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #3b2415;
    }

    header {
      background: #8B4513;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-bottom: 5px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border: none;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: left;
      width: 100%;
      color: #3b2415;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card .icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .card h3 {
      margin-bottom: 5px;
      font-size: 18px;
    }

    .card p {
      color: #777;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Bakery Management System</p>
</header>

<main>

  <section class="welcome">
    <h2>Dashboard</h2>
    <p>Welcome to Kanbulo Bakery Management.</p>
  </section>

  <section class="cards">

    <button class="card" onclick="openPage('sales.html')">
      <div class="icon">🛒</div>
      <h3>Sales</h3>
      <p>Record and manage bakery sales.</p>
    </button>

    <button class="card" onclick="openPage('products.html')">
      <div class="icon">🍞</div>
      <h3>Products</h3>
      <p>Manage bakery products and prices.</p>
    </button>

    <button class="card" onclick="openPage('reports.html')">
      <div class="icon">📊</div>
      <h3>Reports</h3>
      <p>View daily and monthly business reports.</p>
    </button>

    <button class="card" onclick="openPage('expenses.html')">
      <div class="icon">💰</div>
      <h3>Expenses</h3>
      <p>Track bakery expenses and costs.</p>
    </button>

    <button class="card" onclick="openPage('inventory.html')">
      <div class="icon">📦</div>
      <h3>Inventory</h3>
      <p>Keep track of your stock.</p>
    </button>

    <button class="card" onclick="comingSoon('Customers')">
      <div class="icon">👥</div>
      <h3>Customers</h3>
      <p>Manage customer information.</p>
    </button>

  </section>

</main>

<footer>
  Kanbulo Bakery Management © 2026
</footer>

<script>

  function openPage(page) {
    window.location.href = page;
  }

  function comingSoon(feature) {
    alert(feature + " section is coming next.");
  }

</script>

</body>
</html>
```
