<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B4513">

  <title>Sales - Kanbulo Bakery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #3b2415;
    }

    header {
      background: #8B4513;
      color: white;
      padding: 18px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .back {
      background: #eee;
      color: #333;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .add {
      width: 100%;
      background: #8B4513;
      color: white;
      margin-top: 15px;
    }

    .sale-item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      text-align: right;
      margin-top: 20px;
    }

    .record {
      width: 100%;
      background: #228B22;
      color: white;
      margin-top: 15px;
      font-size: 16px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px;
    }

    .history {
      margin-top: 20px;
    }

    .history-item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    @media (max-width: 500px) {
      .top {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Sales</p>
</header>

<main>

  <div class="top">
    <button class="back" onclick="goBack()">← Dashboard</button>
    <h2>New Sale</h2>
  </div>

  <div class="box">

    <label for="product">Product</label>

    <select id="product">
      <option value="">Select product</option>
    </select>

    <label for="quantity">Quantity</label>

    <input
      type="number"
      id="quantity"
      min="1"
      value="1"
    >

    <button class="add" onclick="addToSale()">
      ＋ Add to Sale
    </button>

  </div>

  <div class="box">

    <h2>Current Sale</h2>

    <div id="saleItems">
      <div class="empty">
        No items added yet.
      </div>
    </div>

    <div class="total">
      Total: MVR <span id="total">0.00</span>
    </div>

    <button class="record" onclick="recordSale()">
      ✓ Record Sale
    </button>

  </div>

  <div class="history">

    <h2>Recent Sales</h2>

    <div id="salesHistory">
      <div class="empty">
        No sales recorded yet.
      </div>
    </div>

  </div>

</main>

<script>

const PRODUCT_KEY = "kanbulo_products";
const SALES_KEY = "kanbulo_sales";

let currentSale = [];

function getProducts() {
  try {
    return JSON.parse(localStorage.getItem(PRODUCT_KEY)) || [];
  } catch {
    return [];
  }
}

function getSales() {
  try {
    return JSON.parse(localStorage.getItem(SALES_KEY)) || [];
  } catch {
    return [];
  }
}

function saveProducts(products) {
  localStorage.setItem(
    PRODUCT_KEY,
    JSON.stringify(products)
  );
}

function saveSales(sales) {
  localStorage.setItem(
    SALES_KEY,
    JSON.stringify(sales)
  );
}

function loadProducts() {

  const select = document.getElementById("product");
  const products = getProducts();

  select.innerHTML =
    '<option value="">Select product</option>';

  products.forEach(product => {

    const option = document.createElement("option");

    option.value = product.id;

    option.textContent =
      `${product.name} — MVR ${product.price.toFixed(2)} (Stock: ${product.stock})`;

    select.appendChild(option);

  });
}

function addToSale() {

  const productId =
    Number(document.getElementById("product").value);

  const quantity =
    Number(document.getElementById("quantity").value);

  if (!productId) {
    alert("Please select a product.");
    return;
  }

  if (!quantity || quantity < 1) {
    alert("Please enter a valid quantity.");
    return;
  }

  const products = getProducts();

  const product =
    products.find(p => p.id === productId);

  if (!product) {
    alert("Product not found.");
    return;
  }

  const existing =
    currentSale.find(item => item.productId === productId);

  const alreadyAdded =
    existing ? existing.quantity : 0;

  if (alreadyAdded + quantity > product.stock) {
    alert(
      `Not enough stock. Available: ${product.stock}`
    );
    return;
  }

  if (existing) {

    existing.quantity += quantity;
    existing.total =
      existing.quantity * existing.price;

  } else {

    currentSale.push({
      productId: product.id,
      name: product.name,
      price: product.price,
      quantity: quantity,
      total: product.price * quantity
    });

  }

  displayCurrentSale();

  document.getElementById("quantity").value = 1;
}

function displayCurrentSale() {

  const container =
    document.getElementById("saleItems");

  const totalElement =
    document.getElementById("total");

  if (currentSale.length === 0) {

    container.innerHTML = `
      <div class="empty">
        No items added yet.
      </div>
    `;

    totalElement.textContent = "0.00";

    return;
  }

  let grandTotal = 0;

  container.innerHTML =
    currentSale.map((item, index) => {

      grandTotal += item.total;

      return `
        <div class="sale-item">

          <div>
            <strong>${escapeHTML(item.name)}</strong>
            <br>
            ${item.quantity} × MVR ${item.price.toFixed(2)}
          </div>

          <div>
            <strong>
              MVR ${item.total.toFixed(2)}
            </strong>
            <br>
            <button onclick="removeItem(${index})">
              Remove
            </button>
          </div>

        </div>
      `;

    }).join("");

  totalElement.textContent =
    grandTotal.toFixed(2);
}

function removeItem(index) {

  currentSale.splice(index, 1);

  displayCurrentSale();
}

function recordSale() {

  if (currentSale.length === 0) {
    alert("Please add at least one product.");
    return;
  }

  const products = getProducts();

  currentSale.forEach(item => {

    const product =
      products.find(p => p.id === item.productId);

    if (product) {
      product.stock -= item.quantity;
    }

  });

  saveProducts(products);

  const total =
    currentSale.reduce(
      (sum, item) => sum + item.total,
      0
    );

  const sales = getSales();

  sales.push({
    id: Date.now(),
    date: new Date().toISOString(),
    items: currentSale,
    total: total
  });

  saveSales(sales);

  alert(
    `Sale recorded successfully!\nTotal: MVR ${total.toFixed(2)}`
  );

  currentSale = [];

  loadProducts();
  displayCurrentSale();
  displayHistory();
}

function displayHistory() {

  const container =
    document.getElementById("salesHistory");

  const sales = getSales();

  if (sales.length === 0) {

    container.innerHTML = `
      <div class="empty">
        No sales recorded yet.
      </div>
    `;

    return;
  }

  const recent =
    [...sales].reverse().slice(0, 10);

  container.innerHTML =
    recent.map(sale => {

      const date =
        new Date(sale.date).toLocaleString();

      return `
        <div class="history-item">

          <strong>
            MVR ${sale.total.toFixed(2)}
          </strong>

          <br>

          <small>${date}</small>

          <br><br>

          ${sale.items.map(item =>
            `${escapeHTML(item.name)} × ${item.quantity}`
          ).join("<br>")}

        </div>
      `;

    }).join("");
}

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

function goBack() {
  window.location.href = "index.html";
}

loadProducts();
displayCurrentSale();
displayHistory();

</script>

</body>
</html>
