<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B4513">
  <title>Sales - Kanbulo Bakery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #3b2415;
    }

    header {
      background: #8B4513;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 10px;
    }

    button,
    select,
    input {
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
    }

    .back {
      background: #eee;
      color: #333;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
    }

    .add {
      width: 100%;
      background: #8B4513;
      color: white;
      margin-top: 18px;
    }

    .sale-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .remove {
      background: #f3d6d6;
      color: #900;
      padding: 7px 10px;
      margin-top: 5px;
    }

    .total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }

    .record {
      width: 100%;
      background: #228B22;
      color: white;
      margin-top: 15px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 25px 5px;
    }

    .history-item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .error {
      background: #ffe5e5;
      color: #900;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    @media (max-width: 500px) {
      .top h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Sales</p>
</header>

<main>

  <div class="top">
    <button class="back" onclick="goDashboard()">← Dashboard</button>
    <h2>New Sale</h2>
  </div>

  <div id="errorBox" class="error"></div>

  <div class="box">

    <h2>Make a Sale</h2>

    <label for="productSelect">Product</label>

    <select id="productSelect">
      <option value="">Loading products...</option>
    </select>

    <label for="quantity">Quantity</label>

    <input
      id="quantity"
      type="number"
      min="1"
      value="1"
    >

    <button class="add" onclick="addItem()">
      ＋ Add to Sale
    </button>

  </div>

  <div class="box">

    <h2>Current Sale</h2>

    <div id="currentSale">
      <div class="empty">
        No items added yet.
      </div>
    </div>

    <div class="total">
      Total: MVR <span id="grandTotal">0.00</span>
    </div>

    <button class="record" onclick="completeSale()">
      ✓ Record Sale
    </button>

  </div>

  <h2 style="margin-bottom:12px;">Recent Sales</h2>

  <div id="history">
    <div class="empty">
      No sales recorded yet.
    </div>
  </div>

</main>

<script>

const PRODUCTS_KEY = "kanbulo_products";
const SALES_KEY = "kanbulo_sales";

let products = [];
let cart = [];


function showError(message) {
  const box = document.getElementById("errorBox");
  box.textContent = message;
  box.style.display = "block";
}


function loadProducts() {

  try {

    const saved = localStorage.getItem(PRODUCTS_KEY);

    if (!saved) {
      products = [];
    } else {
      products = JSON.parse(saved);
    }

    if (!Array.isArray(products)) {
      products = [];
    }

  } catch (error) {

    products = [];

    showError(
      "Could not read your products from this browser."
    );

  }

  const select =
    document.getElementById("productSelect");

  select.innerHTML = "";

  if (products.length === 0) {

    select.innerHTML =
      '<option value="">No products found</option>';

    showError(
      "No products were found. Open Products and make sure your Bun is saved."
    );

    return;
  }

  const first =
    document.createElement("option");

  first.value = "";
  first.textContent = "Select product";

  select.appendChild(first);

  products.forEach(product => {

    const option =
      document.createElement("option");

    option.value = String(product.id);

    option.textContent =
      product.name +
      " — MVR " +
      Number(product.price).toFixed(2) +
      " — Stock: " +
      Number(product.stock);

    select.appendChild(option);

  });
}


function addItem() {

  const select =
    document.getElementById("productSelect");

  const productId =
    Number(select.value);

  const quantity =
    Number(document.getElementById("quantity").value);

  if (!productId) {
    alert("Please select a product.");
    return;
  }

  if (!Number.isInteger(quantity) || quantity < 1) {
    alert("Please enter a valid quantity.");
    return;
  }

  const product =
    products.find(p => Number(p.id) === productId);

  if (!product) {
    alert("Product not found.");
    return;
  }

  const existing =
    cart.find(item => Number(item.productId) === productId);

  const currentQuantity =
    existing ? existing.quantity : 0;

  if (
    currentQuantity + quantity >
    Number(product.stock)
  ) {
    alert(
      "Not enough stock. Available stock: " +
      product.stock
    );
    return;
  }

  if (existing) {

    existing.quantity += quantity;

    existing.total =
      existing.quantity *
      Number(existing.price);

  } else {

    cart.push({
      productId: product.id,
      name: product.name,
      price: Number(product.price),
      quantity: quantity,
      total:
        Number(product.price) * quantity
    });

  }

  renderCart();

  document.getElementById("quantity").value = 1;
}


function removeItem(index) {

  cart.splice(index, 1);

  renderCart();
}


function renderCart() {

  const container =
    document.getElementById("currentSale");

  let total = 0;

  if (cart.length === 0) {

    container.innerHTML =
      '<div class="empty">No items added yet.</div>';

    document.getElementById("grandTotal")
      .textContent = "0.00";

    return;
  }

  container.innerHTML =
    cart.map((item, index) => {

      total += item.total;

      return `
        <div class="sale-row">

          <div>
            <strong>${escapeHTML(item.name)}</strong>
            <br>
            ${item.quantity} ×
            MVR ${item.price.toFixed(2)}
          </div>

          <div>
            <strong>
              MVR ${item.total.toFixed(2)}
            </strong>
            <br>

            <button
              class="remove"
              onclick="removeItem(${index})">
              Remove
            </button>
          </div>

        </div>
      `;

    }).join("");

  document.getElementById("grandTotal")
    .textContent = total.toFixed(2);
}


function completeSale() {

  if (cart.length === 0) {
    alert("Please add a product first.");
    return;
  }

  /*
    Reload products directly from localStorage
    so we always use the newest stock.
  */

  let latestProducts;

  try {

    latestProducts =
      JSON.parse(
        localStorage.getItem(PRODUCTS_KEY)
      ) || [];

  } catch {

    alert("Could not read your products.");
    return;
  }

  /*
    Check stock one final time.
  */

  for (const item of cart) {

    const product =
      latestProducts.find(
        p => Number(p.id) === Number(item.productId)
      );

    if (!product) {
      alert(
        "Product " + item.name +
        " could not be found."
      );
      return;
    }

    if (Number(product.stock) < item.quantity) {
      alert(
        "Not enough stock for " +
        item.name +
        ". Available: " +
        product.stock
      );
      return;
    }

  }

  /*
    Reduce stock.
  */

  cart.forEach(item => {

    const product =
      latestProducts.find(
        p => Number(p.id) === Number(item.productId)
      );

    product.stock =
      Number(product.stock) -
      Number(item.quantity);

  });

  /*
    Save updated products.
  */

  localStorage.setItem(
    PRODUCTS_KEY,
    JSON.stringify(latestProducts)
  );

  /*
    Calculate total.
  */

  const total =
    cart.reduce(
      (sum, item) => sum + item.total,
      0
    );

  /*
    Save sale.
  */

  let sales = [];

  try {

    sales =
      JSON.parse(
        localStorage.getItem(SALES_KEY)
      ) || [];

    if (!Array.isArray(sales)) {
      sales = [];
    }

  } catch {

    sales = [];

  }

  sales.push({

    id: Date.now(),

    date:
      new Date().toISOString(),

    items:
      cart.map(item => ({
        productId: item.productId,
        name: item.name,
        price: item.price,
        quantity: item.quantity,
        total: item.total
      })),

    total: total

  });

  localStorage.setItem(
    SALES_KEY,
    JSON.stringify(sales)
  );

  alert(
    "Sale recorded successfully!\n\n" +
    "Total: MVR " +
    total.toFixed(2)
  );

  /*
    Reset page.
  */

  products = latestProducts;

  cart = [];

  loadProducts();

  renderCart();

  renderHistory();
}


function renderHistory() {

  const container =
    document.getElementById("history");

  let sales = [];

  try {

    sales =
      JSON.parse(
        localStorage.getItem(SALES_KEY)
      ) || [];

  } catch {

    sales = [];

  }

  if (!Array.isArray(sales) || sales.length === 0) {

    container.innerHTML =
      '<div class="empty">No sales recorded yet.</div>';

    return;
  }

  const recent =
    [...sales].reverse().slice(0, 10);

  container.innerHTML =
    recent.map(sale => {

      const date =
        new Date(sale.date)
          .toLocaleString();

      const items =
        sale.items.map(item =>
          escapeHTML(item.name) +
          " × " +
          item.quantity
        ).join("<br>");

      return `
        <div class="history-item">

          <strong>
            MVR ${Number(sale.total).toFixed(2)}
          </strong>

          <br>

          <small>${date}</small>

          <br><br>

          ${items}

        </div>
      `;

    }).join("");
}


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;
}


function goDashboard() {
  window.location.href = "index.html";
}


/*
  Start the page.
*/

loadProducts();

renderCart();

renderHistory();

</script>

</body>
</html>
