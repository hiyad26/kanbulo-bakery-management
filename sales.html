<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7B1E2B">
  <title>Sales - Kanbulo Bakery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #4b1f1f;
    }

    header {
      background: #7B1E2B;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.92;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 10px;
    }

    button,
    select,
    input {
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
    }

    .back {
      background: #eee;
      color: #333;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
    }

    .add {
      width: 100%;
      background: #7B1E2B;
      color: white;
      margin-top: 18px;
    }

    .sale-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .sale-left {
      flex: 1;
      min-width: 0;
    }

    .sale-right {
      text-align: right;
      min-width: 105px;
    }

    .custom-price-box {
      margin-top: 10px;
      background: #fffaf5;
      border: 1px solid #ead7c5;
      border-radius: 10px;
      padding: 10px;
    }

    .custom-price-box label {
      margin: 0 0 6px;
      font-size: 13px;
    }

    .custom-price {
      padding: 9px;
      font-size: 15px;
    }

    .price-note {
      color: #777;
      font-size: 12px;
      margin-top: 5px;
    }

    .remove {
      background: #f3d6d6;
      color: #900;
      padding: 7px 10px;
      margin-top: 5px;
    }

    .summary {
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0;
      font-size: 16px;
    }

    .discount-row {
      color: #9b1c31;
    }

    .final-total {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #7B1E2B;
      font-size: 23px;
      font-weight: bold;
      color: #7B1E2B;
    }

    .discount-box {
      background: #fffaf5;
      border: 1px solid #ead7c5;
      border-radius: 12px;
      padding: 15px;
      margin-top: 18px;
    }

    .discount-types {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .discount-type {
      position: relative;
    }

    .discount-type input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .discount-type label {
      margin: 0;
      display: block;
      padding: 11px;
      text-align: center;
      background: white;
      border: 2px solid #ead7c5;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .discount-type input:checked + label {
      background: #f5e0d5;
      border-color: #7B1E2B;
      color: #7B1E2B;
    }

    .discount-input {
      margin-top: 10px;
    }

    .payment-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .payment-option {
      position: relative;
    }

    .payment-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .payment-option label {
      margin: 0;
      display: block;
      padding: 14px 8px;
      text-align: center;
      background: #fff8f0;
      border: 2px solid #ead7c5;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .payment-option input:checked + label {
      background: #f5e0d5;
      border-color: #7B1E2B;
      color: #7B1E2B;
    }

    .record {
      width: 100%;
      background: #3d7655;
      color: white;
      margin-top: 15px;
    }

    .cancel-edit {
      width: 100%;
      background: #eee;
      color: #333;
      margin-top: 10px;
      display: none;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 25px 5px;
    }

    .history-item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .payment-badge,
    .customer-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 7px;
      background: #f5e6d8;
      color: #7B1E2B;
      font-size: 13px;
      font-weight: bold;
    }

    .history-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .edit-sale,
    .delete-sale {
      flex: 1;
      padding: 9px;
      font-size: 14px;
      font-weight: bold;
    }

    .edit-sale {
      background: #f1e2d8;
      color: #7B1E2B;
    }

    .delete-sale {
      background: #fbe3e3;
      color: #b00020;
    }

    .editing-banner {
      display: none;
      background: #f5e0d5;
      color: #7B1E2B;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .editing-banner.show {
      display: block;
    }

    .error {
      background: #ffe5e5;
      color: #900;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    @media (max-width: 600px) {
      .payment-options {
        grid-template-columns: 1fr;
      }

      .history-actions {
        flex-direction: column;
      }

      .sale-row {
        flex-direction: column;
      }

      .sale-right {
        text-align: left;
      }
    }

    @media (max-width: 500px) {
      .top h2 {
        font-size: 20px;
      }
    }
  </style>

</head>

<script>

const PRODUCTS_KEY = "kanbulo_products";
const SALES_KEY = "kanbulo_sales";
const CUSTOMERS_KEY = "kanbulo_customers";

let products = [];
let customers = [];
let cart = [];
let editingSaleId = null;
let originalSaleItems = [];


/* =========================
   ERROR HANDLING
========================= */

function showError(message) {

  const box = document.getElementById("errorBox");

  box.textContent = message;
  box.style.display = "block";

}


function clearError() {

  const box = document.getElementById("errorBox");

  box.textContent = "";
  box.style.display = "none";

}


/* =========================
   PRODUCTS
========================= */

function loadProducts() {

  try {

    const saved =
      localStorage.getItem(PRODUCTS_KEY);

    products =
      saved ? JSON.parse(saved) : [];

    if (!Array.isArray(products)) {
      products = [];
    }

  } catch {

    products = [];

    showError(
      "Could not read your products from this browser."
    );

  }


  const select =
    document.getElementById("productSelect");

  select.innerHTML = "";


  if (products.length === 0) {

    select.innerHTML =
      '<option value="">No products found</option>';

    showError(
      "No products were found. Open Products and make sure your products are saved."
    );

    return;

  }


  const first =
    document.createElement("option");

  first.value = "";
  first.textContent = "Select product";

  select.appendChild(first);


  products.forEach(product => {

    const option =
      document.createElement("option");

    option.value =
      String(product.id);

    option.textContent =
      product.name +
      " — MVR " +
      Number(product.price || 0).toFixed(2) +
      " — Stock: " +
      getAvailableStockForProduct(product.id);

    select.appendChild(option);

  });

}


function getAvailableStockForProduct(productId) {

  const product =
    products.find(
      p => Number(p.id) === Number(productId)
    );

  if (!product) {
    return 0;
  }


  let available =
    Number(product.stock || 0);


  if (editingSaleId !== null) {

    const original =
      originalSaleItems.find(
        item =>
          Number(item.productId) ===
          Number(productId)
      );

    if (original) {

      available +=
        Number(original.quantity || 0);

    }

  }


  return available;

}


/* =========================
   CUSTOMERS
========================= */

function loadCustomers() {

  try {

    const saved =
      localStorage.getItem(CUSTOMERS_KEY);

    customers =
      saved ? JSON.parse(saved) : [];

    if (!Array.isArray(customers)) {
      customers = [];
    }

  } catch {

    customers = [];

  }


  const select =
    document.getElementById("customerSelect");

  if (!select) return;


  const currentValue =
    select.value;


  select.innerHTML =
    '<option value="">Walk-in Customer</option>';


  customers.forEach(customer => {

    const option =
      document.createElement("option");

    option.value =
      String(customer.id);

    option.textContent =
      customer.name +
      (
        customer.phone
          ? " — " + customer.phone
          : ""
      );

    select.appendChild(option);

  });


  if (
    currentValue &&
    customers.some(
      c => String(c.id) === String(currentValue)
    )
  ) {

    select.value =
      currentValue;

  }

}


function getSelectedCustomer() {

  const select =
    document.getElementById("customerSelect");

  if (!select || !select.value) {
    return null;
  }


  return customers.find(
    customer =>
      Number(customer.id) ===
      Number(select.value)
  ) || null;

}


/* =========================
   ADD ITEMS
========================= */

function addItem() {

  clearError();


  const select =
    document.getElementById("productSelect");

  const productId =
    Number(select.value);


  const quantity =
    Number(
      document.getElementById("quantity").value
    );


  if (!productId) {

    alert("Please select a product.");

    return;

  }


  if (
    !Number.isInteger(quantity) ||
    quantity < 1
  ) {

    alert("Please enter a valid quantity.");

    return;

  }


  const product =
    products.find(
      p => Number(p.id) === productId
    );


  if (!product) {

    alert("Product not found.");

    return;

  }


  const existing =
    cart.find(
      item =>
        Number(item.productId) ===
        productId
    );


  const currentQuantity =
    existing
      ? Number(existing.quantity)
      : 0;


  const availableStock =
    getAvailableStockForProduct(productId);


  if (
    currentQuantity + quantity >
    availableStock
  ) {

    alert(
      "Not enough stock. Available stock: " +
      availableStock
    );

    return;

  }


  if (existing) {

    existing.quantity += quantity;

    existing.total =
      existing.quantity *
      Number(existing.price);

  } else {

    cart.push({

      productId:
        product.id,

      name:
        product.name,

      price:
        Number(product.price || 0),

      normalPrice:
        Number(product.price || 0),

      quantity:
        quantity,

      total:
        Number(product.price || 0) *
        quantity

    });

  }


  renderCart();


  document.getElementById("quantity")
    .value = 1;

}


/* =========================
   EDIT ITEM PRICE
========================= */

function updateItemPrice(index, value) {

  if (!cart[index]) {
    return;
  }


  const price =
    Number(value);


  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    alert("Please enter a valid price.");

    renderCart();

    return;

  }


  cart[index].price =
    price;


  cart[index].total =
    price *
    Number(cart[index].quantity);


  renderCart();

}


function removeItem(index) {

  cart.splice(index, 1);

  renderCart();

}


/* =========================
   DISCOUNTS
========================= */

function getDiscountType() {

  const selected =
    document.querySelector(
      'input[name="discountType"]:checked'
    );

  return selected
    ? selected.value
    : "percent";

}


function calculateTotals() {

  const subtotal =
    cart.reduce(
      (sum, item) =>
        sum +
        (
          Number(item.price || 0) *
          Number(item.quantity || 0)
        ),
      0
    );


  const discountValue =
    Math.max(
      0,
      Number(
        document.getElementById("discountValue").value
      ) || 0
    );


  const type =
    getDiscountType();


  let discountAmount =
    type === "percent"
      ? subtotal * discountValue / 100
      : discountValue;


  if (discountAmount > subtotal) {
    discountAmount = subtotal;
  }


  const total =
    Math.max(
      0,
      subtotal - discountAmount
    );


  return {
    subtotal,
    discountType: type,
    discountValue,
    discountAmount,
    total
  };

}


function renderCart() {

  const container =
    document.getElementById("currentSale");


  if (cart.length === 0) {

    container.innerHTML =
      '<div class="empty">No items added yet.</div>';

  } else {

    container.innerHTML =
      cart.map((item, index) => {

        const lineTotal =
          Number(item.price || 0) *
          Number(item.quantity || 0);


        return `

          <div class="sale-row">

            <div class="sale-left">

              <strong>
                ${escapeHTML(item.name)}
              </strong>

              <br>

              Quantity: ${item.quantity}

              <div class="custom-price-box">

                <label>
                  ✏️ Price for this sale
                </label>

                <input
                  class="custom-price"
                  type="number"
                  min="0"
                  step="0.01"
                  value="${Number(item.price || 0).toFixed(2)}"
                  onchange="updateItemPrice(${index}, this.value)"
                >

                ${
                  Number(item.normalPrice || 0) !==
                  Number(item.price || 0)
                    ? `
                      <div class="price-note">
                        Normal product price:
                        MVR ${Number(item.normalPrice || 0).toFixed(2)}
                      </div>
                    `
                    : ""
                }

              </div>

            </div>

            <div class="sale-right">

              <strong>
                MVR ${lineTotal.toFixed(2)}
              </strong>

              <br>

              <button
                class="remove"
                onclick="removeItem(${index})">
                Remove
              </button>

            </div>

          </div>

        `;

      }).join("");

  }


  const totals =
    calculateTotals();


  document.getElementById("subtotal")
    .textContent =
    totals.subtotal.toFixed(2);


  document.getElementById("discountAmount")
    .textContent =
    totals.discountAmount.toFixed(2);


  document.getElementById("grandTotal")
    .textContent =
    totals.total.toFixed(2);

}


/* =========================
   PAYMENT
========================= */

function getPaymentMethod() {

  const selected =
    document.querySelector(
      'input[name="paymentMethod"]:checked'
    );

  return selected
    ? selected.value
    : "Cash";

}


function setPaymentMethod(method) {

  const radios =
    document.querySelectorAll(
      'input[name="paymentMethod"]'
    );


  let found = false;


  radios.forEach(radio => {

    radio.checked =
      radio.value === method;


    if (radio.checked) {
      found = true;
    }

  });


  if (!found) {

    document.getElementById("cash")
      .checked = true;

  }

}


/* =========================
   SALES STORAGE
========================= */

function loadSales() {

  try {

    const saved =
      localStorage.getItem(SALES_KEY);

    const sales =
      saved ? JSON.parse(saved) : [];

    return Array.isArray(sales)
      ? sales
      : [];

  } catch {

    return [];

  }

}


function saveSales(sales) {

  localStorage.setItem(
    SALES_KEY,
    JSON.stringify(sales)
  );

}


/* =========================
   COMPLETE SALE
========================= */

function completeSale() {

  clearError();


  if (cart.length === 0) {

    alert("Please add a product first.");

    return;

  }


  const paymentMethod =
    getPaymentMethod();


  const totals =
    calculateTotals();


  let latestProducts;


  try {

    latestProducts =
      JSON.parse(
        localStorage.getItem(PRODUCTS_KEY)
      ) || [];

  } catch {

    alert("Could not read your products.");

    return;

  }


  if (!Array.isArray(latestProducts)) {
    latestProducts = [];
  }


  const sales =
    loadSales();


  const selectedCustomer =
    getSelectedCustomer();


  /* =========================
     NEW SALE
  ========================= */

  if (editingSaleId === null) {

    for (const item of cart) {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );


      if (!product) {

        alert(
          "Product " +
          item.name +
          " could not be found."
        );

        return;

      }


      if (
        Number(product.stock) <
        Number(item.quantity)
      ) {

        alert(
          "Not enough stock for " +
          item.name +
          ". Available: " +
          product.stock
        );

        return;

      }

    }


    cart.forEach(item => {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );


      product.stock =
        Number(product.stock) -
        Number(item.quantity);

    });


    localStorage.setItem(
      PRODUCTS_KEY,
      JSON.stringify(latestProducts)
    );


    sales.push({

      id:
        Date.now(),

      date:
        new Date().toISOString(),

      customerId:
        selectedCustomer
          ? selectedCustomer.id
          : null,

      customerName:
        selectedCustomer
          ? selectedCustomer.name
          : "Walk-in Customer",

      customerPhone:
        selectedCustomer
          ? selectedCustomer.phone || ""
          : "",

      paymentMethod:
        paymentMethod,

      subtotal:
        totals.subtotal,

      discountType:
        totals.discountType,

      discountValue:
        totals.discountValue,

      discountAmount:
        totals.discountAmount,

      items:
        cart.map(item => ({

          productId:
            item.productId,

          name:
            item.name,

          price:
            Number(item.price),

          normalPrice:
            Number(item.normalPrice || item.price),

          quantity:
            Number(item.quantity),

          total:
            Number(item.price) *
            Number(item.quantity)

        })),

      total:
        totals.total

    });


    saveSales(sales);


    alert(
      "Sale recorded successfully!\n\n" +
      "Customer: " +
      (
        selectedCustomer
          ? selectedCustomer.name
          : "Walk-in Customer"
      ) +
      "\nPayment: " +
      paymentMethod +
      "\nTotal: MVR " +
      totals.total.toFixed(2)
    );

  }


  /* =========================
     EDIT EXISTING SALE
  ========================= */

  else {

    const saleIndex =
      sales.findIndex(
        sale =>
          Number(sale.id) ===
          Number(editingSaleId)
      );


    if (saleIndex === -1) {

      alert(
        "The sale could not be found."
      );

      cancelEdit();

      return;

    }


    const oldSale =
      sales[saleIndex];


    if (Array.isArray(oldSale.items)) {

      for (const oldItem of oldSale.items) {

        const product =
          latestProducts.find(
            p =>
              Number(p.id) ===
              Number(oldItem.productId)
          );


        if (product) {

          product.stock =
            Number(product.stock || 0) +
            Number(oldItem.quantity || 0);

        }

      }

    }


    for (const item of cart) {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );


      if (!product) {

        restoreOriginalStock(
          latestProducts,
          oldSale.items
        );

        alert(
          "Product " +
          item.name +
          " could not be found."
        );

        return;

      }


      if (
        Number(product.stock) <
        Number(item.quantity)
      ) {

        restoreOriginalStock(
          latestProducts,
          oldSale.items
        );

        alert(
          "Not enough stock for " +
          item.name +
          ". Available: " +
          product.stock
        );

        return;

      }

    }


    cart.forEach(item => {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );


      product.stock =
        Number(product.stock) -
        Number(item.quantity);

    });


    localStorage.setItem(
      PRODUCTS_KEY,
      JSON.stringify(latestProducts)
    );


    sales[saleIndex] = {

      ...oldSale,

      customerId:
        selectedCustomer
          ? selectedCustomer.id
          : null,

      customerName:
        selectedCustomer
          ? selectedCustomer.name
          : "Walk-in Customer",

      customerPhone:
        selectedCustomer
          ? selectedCustomer.phone || ""
          : "",

      paymentMethod:
        paymentMethod,

      subtotal:
        totals.subtotal,

      discountType:
        totals.discountType,

      discountValue:
        totals.discountValue,

      discountAmount:
        totals.discountAmount,

      items:
        cart.map(item => ({

          productId:
            item.productId,

          name:
            item.name,

          price:
            Number(item.price),

          normalPrice:
            Number(item.normalPrice || item.price),

          quantity:
            Number(item.quantity),

          total:
            Number(item.price) *
            Number(item.quantity)

        })),

      total:
        totals.total

    };


    saveSales(sales);


    alert(
      "Sale updated successfully!\n\n" +
      "Customer: " +
      (
        selectedCustomer
          ? selectedCustomer.name
          : "Walk-in Customer"
      ) +
      "\nPayment: " +
      paymentMethod +
      "\nTotal: MVR " +
      totals.total.toFixed(2)
    );

  }


  resetSaleForm();


  products =
    latestProducts;


  loadProducts();

  loadCustomers();

  renderCart();

  renderHistory();

}


/* =========================
   STOCK RESTORATION
========================= */

function restoreOriginalStock(productsList, oldItems) {

  if (!Array.isArray(oldItems)) {
    return;
  }


  oldItems.forEach(oldItem => {

    const product =
      productsList.find(
        p =>
          Number(p.id) ===
          Number(oldItem.productId)
      );


    if (product) {

      product.stock =
        Number(product.stock || 0) +
        Number(oldItem.quantity || 0);

    }

  });

}


/* =========================
   EDIT SALE
========================= */

function editSale(id) {

  clearError();


  const sales =
    loadSales();


  const sale =
    sales.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if (!sale) {

    alert("Sale not found.");

    return;

  }


  if (
    !Array.isArray(sale.items) ||
    sale.items.length === 0
  ) {

    alert(
      "This sale cannot be edited because it has no items."
    );

    return;

  }


  editingSaleId =
    sale.id;


  originalSaleItems =
    sale.items.map(item => ({

      productId:
        item.productId,

      quantity:
        Number(item.quantity || 0)

    }));


  cart =
    sale.items.map(item => ({

      productId:
        item.productId,

      name:
        item.name,

      price:
        Number(item.price || 0),

      normalPrice:
        Number(
          item.normalPrice ||
          item.price ||
          0
        ),

      quantity:
        Number(item.quantity || 0),

      total:
        Number(item.total || 0)

    }));


  loadCustomers();


  const customerSelect =
    document.getElementById("customerSelect");


  if (
    sale.customerId &&
    customers.some(
      c =>
        Number(c.id) ===
        Number(sale.customerId)
    )
  ) {

    customerSelect.value =
      String(sale.customerId);

  } else {

    customerSelect.value = "";

  }


  document.getElementById("saleFormTitle")
    .textContent =
    "✏️ Edit Sale";


  document.getElementById("editingBanner")
    .classList.add("show");


  document.getElementById("recordButton")
    .textContent =
    "✓ Update Sale";


  document.getElementById("cancelEditButton")
    .style.display =
    "block";


  setPaymentMethod(
    sale.paymentMethod || "Cash"
  );


  const discountType =
    sale.discountType || "percent";


  const percentRadio =
    document.getElementById("discountPercent");


  const fixedRadio =
    document.getElementById("discountFixed");


  if (discountType === "fixed") {

    fixedRadio.checked = true;
    percentRadio.checked = false;

  } else {

    percentRadio.checked = true;
    fixedRadio.checked = false;

  }


  document.getElementById("discountValue")
    .value =
    Number(sale.discountValue || 0);


  loadProducts();

  renderCart();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

  resetSaleForm();

  loadProducts();

  loadCustomers();

  renderCart();

}


/* =========================
   RESET
========================= */

function resetSaleForm() {

  editingSaleId =
    null;


  originalSaleItems =
    [];


  cart =
    [];


  document.getElementById("saleFormTitle")
    .textContent =
    "Make a Sale";


  document.getElementById("editingBanner")
    .classList.remove("show");


  document.getElementById("recordButton")
    .textContent =
    "✓ Record Sale";


  document.getElementById("cancelEditButton")
    .style.display =
    "none";


  document.getElementById("quantity")
    .value =
    1;


  document.getElementById("customerSelect")
    .value =
    "";


  document.getElementById("discountValue")
    .value =
    0;


  document.getElementById("discountPercent")
    .checked =
    true;


  setPaymentMethod("Cash");

}


/* =========================
   DELETE SALE
========================= */

function deleteSale(id) {

  clearError();


  const sales =
    loadSales();


  const index =
    sales.findIndex(
      sale =>
        Number(sale.id) ===
        Number(id)
    );


  if (index === -1) {

    alert("Sale not found.");

    return;

  }


  const sale =
    sales[index];


  const confirmed =
    confirm(
      "Delete this sale?\n\n" +
      "Total: MVR " +
      Number(sale.total || 0).toFixed(2) +
      "\n\n" +
      "The sold quantities will be returned to inventory."
    );


  if (!confirmed) {
    return;
  }


  let latestProducts;


  try {

    latestProducts =
      JSON.parse(
        localStorage.getItem(PRODUCTS_KEY)
      ) || [];

  } catch {

    latestProducts = [];

  }


  if (!Array.isArray(latestProducts)) {
    latestProducts = [];
  }


  let missingProducts = [];


  if (Array.isArray(sale.items)) {

    sale.items.forEach(item => {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );


      if (product) {

        product.stock =
          Number(product.stock || 0) +
          Number(item.quantity || 0);

      } else {

        missingProducts.push(
          item.name
        );

      }

    });

  }


  sales.splice(index, 1);

  saveSales(sales);


  localStorage.setItem(
    PRODUCTS_KEY,
    JSON.stringify(latestProducts)
  );


  if (
    Number(editingSaleId) ===
    Number(id)
  ) {

    resetSaleForm();

  }


  products =
    latestProducts;


  loadProducts();

  loadCustomers();

  renderCart();

  renderHistory();


  if (missingProducts.length > 0) {

    alert(
      "Sale deleted.\n\n" +
      "Some products could not be returned to stock because they no longer exist in Inventory:\n" +
      missingProducts.join(", ")
    );

  } else {

    alert(
      "Sale deleted successfully.\n\n" +
      "Stock has been returned to Inventory."
    );

  }

}


/* =========================
   HISTORY
========================= */

function renderHistory() {

  const container =
    document.getElementById("history");


  const sales =
    loadSales();


  if (sales.length === 0) {

    container.innerHTML =
      '<div class="empty">No sales recorded yet.</div>';

    return;

  }


  const recent =
    [...sales]
      .reverse()
      .slice(0, 10);


  container.innerHTML =
    recent.map(sale => {

      const date =
        new Date(sale.date)
          .toLocaleString();


      const items =
        Array.isArray(sale.items)
          ? sale.items.map(item => {

              const lineTotal =
                Number(item.price || 0) *
                Number(item.quantity || 0);

              const normalPrice =
                Number(
                  item.normalPrice ||
                  item.price ||
                  0
                );

              const customPrice =
                Number(item.price || 0);

              return `
                ${escapeHTML(item.name)}
                × ${item.quantity}
                — MVR ${lineTotal.toFixed(2)}
                ${
                  normalPrice !== customPrice
                    ? `
                      <br>
                      <small>
                        Sale price: MVR ${customPrice.toFixed(2)}
                        | Normal: MVR ${normalPrice.toFixed(2)}
                      </small>
                    `
                    : ""
                }
              `;

            }).join("<br>")
          : "";


      const payment =
        sale.paymentMethod ||
        "Previous Sale";


      const customer =
        sale.customerName ||
        "Walk-in Customer";


      return `

        <div class="history-item">

          <strong>
            MVR ${Number(sale.total || 0).toFixed(2)}
          </strong>

          <br>

          <small>
            ${date}
          </small>

          <br>

          <span class="customer-badge">
            👤 ${escapeHTML(customer)}
          </span>

          <br>

          <span class="payment-badge">
            ${escapeHTML(payment)}
          </span>

          <br><br>

          ${
            sale.subtotal !== undefined
              ? `
                <small>
                  Subtotal: MVR
                  ${Number(sale.subtotal).toFixed(2)}
                  ${
                    Number(sale.discountAmount || 0) > 0
                      ? `
                        <br>
                        Discount: - MVR
                        ${Number(sale.discountAmount).toFixed(2)}
                      `
                      : ""
                  }
                </small>

                <br><br>
              `
              : ""
          }

          ${items}

          <div class="history-actions">

            <button
              class="edit-sale"
              onclick="editSale(${sale.id})">
              ✏️ Edit
            </button>

            <button
              class="delete-sale"
              onclick="deleteSale(${sale.id})">
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   UTILITIES
========================= */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;

}


function goDashboard() {

  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

loadCustomers();

loadProducts();

renderCart();

renderHistory();

</script>

</body>
</html>
