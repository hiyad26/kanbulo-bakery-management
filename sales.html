<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Sales</p>
</header>

<main>

  <div class="top">
    <button class="back" onclick="goDashboard()">← Dashboard</button>
    <h2>New Sale</h2>
  </div>

  <div id="errorBox" class="error"></div>

  <div class="box">

    <h2 id="saleFormTitle">Make a Sale</h2>

    <div id="editingBanner" class="editing-banner">
      ✏️ Editing an existing sale
    </div>

    <label for="productSelect">Product</label>

    <select id="productSelect">
      <option value="">Loading products...</option>
    </select>

    <label for="quantity">Quantity</label>

    <input
      id="quantity"
      type="number"
      min="1"
      value="1"
    >

    <button class="add" onclick="addItem()">
      ＋ Add to Sale
    </button>

  </div>

  <div class="box">

    <h2>Current Sale</h2>

    <div id="currentSale">
      <div class="empty">
        No items added yet.
      </div>
    </div>

    <div class="total">
      Total: MVR <span id="grandTotal">0.00</span>
    </div>

    <label>Payment Method</label>

    <div class="payment-options">

      <div class="payment-option">
        <input
          type="radio"
          id="cash"
          name="paymentMethod"
          value="Cash"
          checked
        >
        <label for="cash">💵 Cash</label>
      </div>

      <div class="payment-option">
        <input
          type="radio"
          id="card"
          name="paymentMethod"
          value="Card"
        >
        <label for="card">💳 Card</label>
      </div>

      <div class="payment-option">
        <input
          type="radio"
          id="transfer"
          name="paymentMethod"
          value="Bank Transfer"
        >
        <label for="transfer">🏦 Transfer</label>
      </div>

    </div>

    <button id="recordButton" class="record" onclick="completeSale()">
      ✓ Record Sale
    </button>

    <button
      id="cancelEditButton"
      class="cancel-edit"
      onclick="cancelEdit()"
    >
      Cancel Edit
    </button>

  </div>

  <h2 style="margin-bottom:12px;">Recent Sales</h2>

  <div id="history">
    <div class="empty">
      No sales recorded yet.
    </div>
  </div>

</main>

<script>

const PRODUCTS_KEY = "kanbulo_products";
const SALES_KEY = "kanbulo_sales";

let products = [];
let cart = [];
let editingSaleId = null;
let originalSaleItems = [];


function showError(message) {

  const box =
    document.getElementById("errorBox");

  box.textContent = message;

  box.style.display = "block";
}


function clearError() {

  const box =
    document.getElementById("errorBox");

  box.textContent = "";

  box.style.display = "none";
}


function loadProducts() {

  try {

    const saved =
      localStorage.getItem(PRODUCTS_KEY);

    if (!saved) {
      products = [];
    } else {
      products = JSON.parse(saved);
    }

    if (!Array.isArray(products)) {
      products = [];
    }

  } catch (error) {

    products = [];

    showError(
      "Could not read your products from this browser."
    );

  }

  const select =
    document.getElementById("productSelect");

  select.innerHTML = "";

  if (products.length === 0) {

    select.innerHTML =
      '<option value="">No products found</option>';

    showError(
      "No products were found. Open Products and make sure your products are saved."
    );

    return;
  }

  const first =
    document.createElement("option");

  first.value = "";

  first.textContent =
    "Select product";

  select.appendChild(first);

  products.forEach(product => {

    const option =
      document.createElement("option");

    option.value =
      String(product.id);

    option.textContent =
      product.name +
      " — MVR " +
      Number(product.price || 0).toFixed(2) +
      " — Stock: " +
      getAvailableStockForProduct(product.id);

    select.appendChild(option);

  });

}


function getAvailableStockForProduct(productId) {

  const product =
    products.find(
      p => Number(p.id) === Number(productId)
    );

  if (!product) {
    return 0;
  }

  let available =
    Number(product.stock || 0);

  /*
    When editing a sale, add the original
    quantity back temporarily. This means
    the user can edit the sale correctly.
  */

  if (editingSaleId !== null) {

    const original =
      originalSaleItems.find(
        item =>
          Number(item.productId) ===
          Number(productId)
      );

    if (original) {

      available +=
        Number(original.quantity || 0);

    }

  }

  return available;

}


function addItem() {

  clearError();

  const select =
    document.getElementById("productSelect");

  const productId =
    Number(select.value);

  const quantity =
    Number(
      document.getElementById("quantity").value
    );

  if (!productId) {

    alert(
      "Please select a product."
    );

    return;
  }

  if (
    !Number.isInteger(quantity) ||
    quantity < 1
  ) {

    alert(
      "Please enter a valid quantity."
    );

    return;
  }

  const product =
    products.find(
      p => Number(p.id) === productId
    );

  if (!product) {

    alert(
      "Product not found."
    );

    return;
  }

  const existing =
    cart.find(
      item =>
        Number(item.productId) ===
        productId
    );

  const currentQuantity =
    existing
      ? Number(existing.quantity)
      : 0;

  const availableStock =
    getAvailableStockForProduct(productId);

  if (
    currentQuantity + quantity >
    availableStock
  ) {

    alert(
      "Not enough stock. Available stock: " +
      availableStock
    );

    return;
  }

  if (existing) {

    existing.quantity += quantity;

    existing.total =
      existing.quantity *
      Number(existing.price);

  } else {

    cart.push({

      productId:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      quantity:
        quantity,

      total:
        Number(product.price) *
        quantity

    });

  }

  renderCart();

  document.getElementById("quantity")
    .value = 1;

}


function removeItem(index) {

  cart.splice(index, 1);

  renderCart();

}


function renderCart() {

  const container =
    document.getElementById("currentSale");

  let total = 0;

  if (cart.length === 0) {

    container.innerHTML =
      '<div class="empty">No items added yet.</div>';

    document.getElementById("grandTotal")
      .textContent = "0.00";

    return;
  }

  container.innerHTML =
    cart.map((item, index) => {

      total += Number(item.total);

      return `

        <div class="sale-row">

          <div>

            <strong>
              ${escapeHTML(item.name)}
            </strong>

            <br>

            ${item.quantity} ×
            MVR ${Number(item.price).toFixed(2)}

          </div>

          <div>

            <strong>
              MVR ${Number(item.total).toFixed(2)}
            </strong>

            <br>

            <button
              class="remove"
              onclick="removeItem(${index})">

              Remove

            </button>

          </div>

        </div>

      `;

    }).join("");

  document.getElementById("grandTotal")
    .textContent =
    total.toFixed(2);

}


function getPaymentMethod() {

  const selected =
    document.querySelector(
      'input[name="paymentMethod"]:checked'
    );

  return selected
    ? selected.value
    : "Cash";

}


function setPaymentMethod(method) {

  const radios =
    document.querySelectorAll(
      'input[name="paymentMethod"]'
    );

  let found = false;

  radios.forEach(radio => {

    radio.checked =
      radio.value === method;

    if (radio.checked) {
      found = true;
    }

  });

  if (!found) {

    document.getElementById("cash")
      .checked = true;

  }

}


function loadSales() {

  try {

    const saved =
      localStorage.getItem(SALES_KEY);

    const sales =
      saved ? JSON.parse(saved) : [];

    return Array.isArray(sales)
      ? sales
      : [];

  } catch {

    return [];

  }

}


function saveSales(sales) {

  localStorage.setItem(
    SALES_KEY,
    JSON.stringify(sales)
  );

}


function completeSale() {

  clearError();

  if (cart.length === 0) {

    alert(
      "Please add a product first."
    );

    return;
  }

  const paymentMethod =
    getPaymentMethod();


  /*
    Reload the newest products.
  */

  let latestProducts;

  try {

    latestProducts =
      JSON.parse(
        localStorage.getItem(PRODUCTS_KEY)
      ) || [];

  } catch {

    alert(
      "Could not read your products."
    );

    return;
  }

  if (!Array.isArray(latestProducts)) {
    latestProducts = [];
  }


  /*
    Load sales.
  */

  const sales =
    loadSales();


  /*
    NEW SALE
  */

  if (editingSaleId === null) {

    /*
      Check stock.
    */

    for (const item of cart) {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );

      if (!product) {

        alert(
          "Product " +
          item.name +
          " could not be found."
        );

        return;
      }

      if (
        Number(product.stock) <
        Number(item.quantity)
      ) {

        alert(
          "Not enough stock for " +
          item.name +
          ". Available: " +
          product.stock
        );

        return;
      }

    }


    /*
      Reduce stock.
    */

    cart.forEach(item => {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );

      product.stock =
        Number(product.stock) -
        Number(item.quantity);

    });


    localStorage.setItem(
      PRODUCTS_KEY,
      JSON.stringify(latestProducts)
    );


    const total =
      cart.reduce(
        (sum, item) =>
          sum + Number(item.total),
        0
      );


    sales.push({

      id:
        Date.now(),

      date:
        new Date().toISOString(),

      paymentMethod:
        paymentMethod,

      items:
        cart.map(item => ({

          productId:
            item.productId,

          name:
            item.name,

          price:
            Number(item.price),

          quantity:
            Number(item.quantity),

          total:
            Number(item.total)

        })),

      total:
        total

    });


    saveSales(sales);


    alert(
      "Sale recorded successfully!\n\n" +
      "Payment: " +
      paymentMethod +
      "\n" +
      "Total: MVR " +
      total.toFixed(2)
    );

  }


  /*
    EDIT EXISTING SALE
  */

  else {

    const saleIndex =
      sales.findIndex(
        sale =>
          Number(sale.id) ===
          Number(editingSaleId)
      );

    if (saleIndex === -1) {

      alert(
        "The sale could not be found."
      );

      cancelEdit();

      return;
    }


    const oldSale =
      sales[saleIndex];


    /*
      Start from the newest real stock.
    */

    /*
      Restore the old sale quantities first.
    */

    if (Array.isArray(oldSale.items)) {

      for (const oldItem of oldSale.items) {

        const product =
          latestProducts.find(
            p =>
              Number(p.id) ===
              Number(oldItem.productId)
          );

        if (product) {

          product.stock =
            Number(product.stock || 0) +
            Number(oldItem.quantity || 0);

        }

      }

    }


    /*
      Now check whether the edited sale
      can be fulfilled.
    */

    for (const item of cart) {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );

      if (!product) {

        alert(
          "Product " +
          item.name +
          " could not be found."
        );

        return;
      }

      if (
        Number(product.stock) <
        Number(item.quantity)
      ) {

        /*
          Put stock back to its original
          state before stopping.
        */

        restoreOriginalStock(
          latestProducts,
          oldSale.items
        );

        alert(
          "Not enough stock for " +
          item.name +
          ". Available: " +
          product.stock
        );

        return;
      }

    }


    /*
      Deduct the new edited quantities.
    */

    cart.forEach(item => {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );

      product.stock =
        Number(product.stock) -
        Number(item.quantity);

    });


    localStorage.setItem(
      PRODUCTS_KEY,
      JSON.stringify(latestProducts)
    );


    const total =
      cart.reduce(
        (sum, item) =>
          sum + Number(item.total),
        0
      );


    /*
      Update the sale but keep its
      original date and ID.
    */

    sales[saleIndex] = {

      ...oldSale,

      paymentMethod:
        paymentMethod,

      items:
        cart.map(item => ({

          productId:
            item.productId,

          name:
            item.name,

          price:
            Number(item.price),

          quantity:
            Number(item.quantity),

          total:
            Number(item.total)

        })),

      total:
        total

    };


    saveSales(sales);


    alert(
      "Sale updated successfully!\n\n" +
      "Payment: " +
      paymentMethod +
      "\n" +
      "Total: MVR " +
      total.toFixed(2)
    );

  }


  resetSaleForm();

  products =
    latestProducts;

  loadProducts();

  renderCart();

  renderHistory();

}


function restoreOriginalStock(productsList, oldItems) {

  if (!Array.isArray(oldItems)) {
    return;
  }

  oldItems.forEach(oldItem => {

    const product =
      productsList.find(
        p =>
          Number(p.id) ===
          Number(oldItem.productId)
      );

    if (product) {

      product.stock =
        Number(product.stock || 0) +
        Number(oldItem.quantity || 0);

    }

  });

}


function editSale(id) {

  clearError();

  const sales =
    loadSales();

  const sale =
    sales.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if (!sale) {

    alert(
      "Sale not found."
    );

    return;
  }


  if (
    !Array.isArray(sale.items) ||
    sale.items.length === 0
  ) {

    alert(
      "This sale cannot be edited because it has no items."
    );

    return;
  }


  editingSaleId =
    sale.id;

  originalSaleItems =
    sale.items.map(item => ({

      productId:
        item.productId,

      quantity:
        Number(item.quantity || 0)

    }));


  /*
    Copy the sale into the current cart.
    Stock is NOT changed yet.
  */

  cart =
    sale.items.map(item => ({

      productId:
        item.productId,

      name:
        item.name,

      price:
        Number(item.price),

      quantity:
        Number(item.quantity),

      total:
        Number(item.total)

    }));


  document.getElementById("saleFormTitle")
    .textContent =
    "✏️ Edit Sale";


  document.getElementById("editingBanner")
    .classList.add("show");


  document.getElementById("recordButton")
    .textContent =
    "✓ Update Sale";


  document.getElementById("cancelEditButton")
    .style.display =
    "block";


  setPaymentMethod(
    sale.paymentMethod || "Cash"
  );


  loadProducts();

  renderCart();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function cancelEdit() {

  resetSaleForm();

  loadProducts();

  renderCart();

}


function resetSaleForm() {

  editingSaleId =
    null;

  originalSaleItems =
    [];

  cart =
    [];

  document.getElementById("saleFormTitle")
    .textContent =
    "Make a Sale";

  document.getElementById("editingBanner")
    .classList.remove("show");

  document.getElementById("recordButton")
    .textContent =
    "✓ Record Sale";

  document.getElementById("cancelEditButton")
    .style.display =
    "none";

  document.getElementById("quantity")
    .value =
    1;

  setPaymentMethod("Cash");

}


function deleteSale(id) {

  clearError();

  const sales =
    loadSales();

  const index =
    sales.findIndex(
      sale =>
        Number(sale.id) ===
        Number(id)
    );

  if (index === -1) {

    alert(
      "Sale not found."
    );

    return;
  }


  const sale =
    sales[index];


  const confirmed =
    confirm(
      "Delete this sale?\n\n" +
      "Total: MVR " +
      Number(sale.total || 0).toFixed(2) +
      "\n\n" +
      "The sold quantities will be returned to inventory."
    );


  if (!confirmed) {
    return;
  }


  /*
    Restore stock from the deleted sale.
  */

  let latestProducts;

  try {

    latestProducts =
      JSON.parse(
        localStorage.getItem(PRODUCTS_KEY)
      ) || [];

  } catch {

    latestProducts = [];

  }

  if (!Array.isArray(latestProducts)) {
    latestProducts = [];
  }


  let missingProducts = [];


  if (Array.isArray(sale.items)) {

    sale.items.forEach(item => {

      const product =
        latestProducts.find(
          p =>
            Number(p.id) ===
            Number(item.productId)
        );

      if (product) {

        product.stock =
          Number(product.stock || 0) +
          Number(item.quantity || 0);

      } else {

        missingProducts.push(
          item.name
        );

      }

    });

  }


  /*
    Remove the sale.
  */

  sales.splice(index, 1);

  saveSales(sales);


  /*
    Save restored inventory.
  */

  localStorage.setItem(
    PRODUCTS_KEY,
    JSON.stringify(latestProducts)
  );


  /*
    If the deleted sale was currently
    being edited, cancel editing.
  */

  if (
    Number(editingSaleId) ===
    Number(id)
  ) {

    resetSaleForm();

  }


  products =
    latestProducts;

  loadProducts();

  renderCart();

  renderHistory();


  if (missingProducts.length > 0) {

    alert(
      "Sale deleted.\n\n" +
      "Some products could not be returned to stock because they no longer exist in Inventory:\n" +
      missingProducts.join(", ")
    );

  } else {

    alert(
      "Sale deleted successfully.\n\n" +
      "Stock has been returned to Inventory."
    );

  }

}


function renderHistory() {

  const container =
    document.getElementById("history");

  const sales =
    loadSales();


  if (
    sales.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">No sales recorded yet.</div>';

    return;
  }


  const recent =
    [...sales]
      .reverse()
      .slice(0, 10);


  container.innerHTML =
    recent.map(sale => {

      const date =
        new Date(sale.date)
          .toLocaleString();

      const items =
        Array.isArray(sale.items)
          ? sale.items.map(item =>
              escapeHTML(item.name) +
              " × " +
              item.quantity
            ).join("<br>")
          : "";


      /*
        Old sales without a payment method
        are labelled as Previous Sale.
      */

      const payment =
        sale.paymentMethod ||
        "Previous Sale";


      return `

        <div class="history-item">

          <strong>
            MVR ${Number(sale.total).toFixed(2)}
          </strong>

          <br>

          <small>
            ${date}
          </small>

          <br>

          <span class="payment-badge">
            ${escapeHTML(payment)}
          </span>

          <br><br>

          ${items}

          <div class="history-actions">

            <button
              class="edit-sale"
              onclick="editSale(${sale.id})"
            >
              ✏️ Edit
            </button>

            <button
              class="delete-sale"
              onclick="deleteSale(${sale.id})"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;

}


function goDashboard() {

  window.location.href =
    "index.html";

}


/*
  Start the page.
*/

loadProducts();

renderCart();

renderHistory();

</script>

</body>
</html>
