<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Inventory</p>
</header>

<main>

  <button class="back" onclick="goDashboard()">
    ← Dashboard
  </button>

  <h2>📦 Inventory</h2>

  <button class="add-button" onclick="openAddForm()">
    ➕ Add Product
  </button>

  <div class="form-box" id="formBox">

    <h3 id="formTitle">➕ Add Product</h3>

    <div class="field">
      <label for="productName">Product Name</label>
      <input
        type="text"
        id="productName"
        placeholder="Example: Bun"
      >
    </div>

    <div class="field">
      <label for="productPrice">Selling Price (MVR)</label>
      <input
        type="number"
        id="productPrice"
        placeholder="Example: 5"
        min="0"
        step="0.01"
      >
    </div>

    <div class="field">
      <label for="productStock">Stock Quantity</label>
      <input
        type="number"
        id="productStock"
        placeholder="Example: 20"
        min="0"
        step="1"
      >
    </div>

    <div class="form-buttons">

      <button
        class="save-button"
        onclick="saveProduct()"
      >
        💾 Save Product
      </button>

      <button
        class="cancel-button"
        onclick="closeForm()"
      >
        Cancel
      </button>

    </div>

  </div>

  <div class="summary">

    <div class="summary-card">
      <h3>Total Products</h3>
      <div class="summary-value" id="productCount">
        0
      </div>
    </div>

    <div class="summary-card">
      <h3>Total Stock</h3>
      <div class="summary-value" id="stockCount">
        0
      </div>
    </div>

  </div>

  <div id="inventoryList"></div>

</main>

<script>

const PRODUCTS_KEY = "kanbulo_products";

let editingProductId = null;


function getProducts() {

  try {

    const saved =
      localStorage.getItem(PRODUCTS_KEY);

    const products =
      saved ? JSON.parse(saved) : [];

    return Array.isArray(products)
      ? products
      : [];

  } catch (error) {

    return [];

  }

}


function saveProducts(products) {

  localStorage.setItem(
    PRODUCTS_KEY,
    JSON.stringify(products)
  );

}


function loadInventory() {

  const products =
    getProducts();

  let totalStock = 0;

  products.forEach(product => {

    totalStock +=
      Number(product.stock || 0);

  });


  document.getElementById("productCount")
    .textContent = products.length;

  document.getElementById("stockCount")
    .textContent = totalStock;


  const list =
    document.getElementById("inventoryList");


  if (products.length === 0) {

    list.innerHTML =
      '<div class="empty">No products found.</div>';

    return;

  }


  list.innerHTML =
    products.map(product => {

      const stock =
        Number(product.stock || 0);

      const price =
        Number(product.price || 0);


      let status = "";

      if (stock <= 0) {

        status =
          '<div class="out">🔴 Out of stock</div>';

      } else if (stock <= 5) {

        status =
          '<div class="low">⚠️ Low stock</div>';

      } else {

        status =
          '<div class="ok">✓ Stock available</div>';

      }


      return `
        <div class="product">

          <div class="product-top">

            <div class="product-name">
              ${escapeHTML(product.name)}
            </div>

            <div class="stock">
              📦 ${stock}
            </div>

          </div>

          <div class="price">
            Selling price: MVR ${price.toFixed(2)}
          </div>

          ${status}

          <div class="actions">

            <button
              class="action-button edit-button"
              onclick="editProduct(${product.id})"
            >
              ✏️ Edit
            </button>

            <button
              class="action-button delete-button"
              onclick="deleteProduct(${product.id})"
            >
              🗑️ Delete
            </button>

          </div>

        </div>
      `;

    }).join("");

}


function openAddForm() {

  editingProductId = null;

  document.getElementById("formTitle")
    .textContent = "➕ Add Product";

  document.getElementById("productName")
    .value = "";

  document.getElementById("productPrice")
    .value = "";

  document.getElementById("productStock")
    .value = "";

  document.getElementById("formBox")
    .classList.add("show");

  document.getElementById("productName")
    .focus();

}


function editProduct(id) {

  const products =
    getProducts();

  const product =
    products.find(p => Number(p.id) === Number(id));

  if (!product) {

    alert("Product not found.");

    return;

  }


  editingProductId = id;

  document.getElementById("formTitle")
    .textContent = "✏️ Edit Product";

  document.getElementById("productName")
    .value = product.name || "";

  document.getElementById("productPrice")
    .value = Number(product.price || 0);

  document.getElementById("productStock")
    .value = Number(product.stock || 0);

  document.getElementById("formBox")
    .classList.add("show");

  document.getElementById("productName")
    .focus();

}


function saveProduct() {

  const name =
    document.getElementById("productName")
      .value.trim();

  const price =
    Number(
      document.getElementById("productPrice")
        .value
    );

  const stock =
    Number(
      document.getElementById("productStock")
        .value
    );


  if (!name) {

    alert("Please enter a product name.");

    return;

  }


  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    alert("Please enter a valid selling price.");

    return;

  }


  if (
    !Number.isFinite(stock) ||
    stock < 0 ||
    !Number.isInteger(stock)
  ) {

    alert("Please enter a valid whole-number stock quantity.");

    return;

  }


  const products =
    getProducts();


  if (editingProductId === null) {

    const newProduct = {

      id: Date.now(),

      name: name,

      price: price,

      stock: stock

    };


    products.push(newProduct);

    saveProducts(products);

    alert("Product added successfully.");

  } else {

    const index =
      products.findIndex(
        p => Number(p.id) === Number(editingProductId)
      );


    if (index === -1) {

      alert("Product not found.");

      return;

    }


    products[index].name =
      name;

    products[index].price =
      price;

    products[index].stock =
      stock;


    saveProducts(products);

    alert("Product updated successfully.");

  }


  closeForm();

  loadInventory();

}


function deleteProduct(id) {

  const products =
    getProducts();

  const product =
    products.find(
      p => Number(p.id) === Number(id)
    );


  if (!product) {

    alert("Product not found.");

    return;

  }


  const confirmed =
    confirm(
      'Delete "' +
      product.name +
      '" from your products?'
    );


  if (!confirmed) {

    return;

  }


  const updated =
    products.filter(
      p => Number(p.id) !== Number(id)
    );


  saveProducts(updated);

  loadInventory();

  alert("Product deleted.");

}


function closeForm() {

  editingProductId = null;

  document.getElementById("formBox")
    .classList.remove("show");

}


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;

}


function goDashboard() {

  window.location.href =
    "index.html";

}


loadInventory();

</script>

</body>
</html>
