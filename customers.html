<!DOCTYPE html>

    * {

    }

    .customer {

    }

<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Customers</p>
</header>

<main>

  <button class="back" onclick="goDashboard()">
    ← Dashboard
  </button>

  <h2>👥 Customers</h2>

  <div class="box">

    <h3>Add Customer</h3>

    <label for="customerName">
      Customer Name
    </label>

    <input
      id="customerName"
      type="text"
      placeholder="Enter customer name"
    >

    <label for="customerPhone">
      Phone Number
    </label>

    <input
      id="customerPhone"
      type="tel"
      placeholder="Enter phone number"
    >

    <button class="add" onclick="addCustomer()">
      ＋ Add Customer
    </button>

  </div>

  <div class="summary">
    👥 Total Customers:
    <strong id="customerCount">0</strong>
  </div>

  <div id="customerList"></div>

</main>

<script>

const CUSTOMERS_KEY = "kanbulo_customers";


function getCustomers() {

  try {

    const saved =
      localStorage.getItem(CUSTOMERS_KEY);

    const customers =
      saved ? JSON.parse(saved) : [];

    return Array.isArray(customers)
      ? customers
      : [];

  } catch (error) {

    return [];

  }

}


function saveCustomers(customers) {

  localStorage.setItem(
    CUSTOMERS_KEY,
    JSON.stringify(customers)
  );

}


function addCustomer() {

  const name =
    document.getElementById("customerName")
      .value.trim();

  const phone =
    document.getElementById("customerPhone")
      .value.trim();


  if (!name) {

    alert("Please enter the customer name.");

    return;

  }


  const customers =
    getCustomers();


  customers.push({

    id: Date.now(),

    name: name,

    phone: phone,

    date:
      new Date().toISOString()

  });


  saveCustomers(customers);


  document.getElementById("customerName")
    .value = "";

  document.getElementById("customerPhone")
    .value = "";


  renderCustomers();

}


function deleteCustomer(id) {

  const customers =
    getCustomers();

  const updated =
    customers.filter(
      customer =>
        Number(customer.id) !== Number(id)
    );


  saveCustomers(updated);

  renderCustomers();

}


function renderCustomers() {

  const customers =
    getCustomers();

  const list =
    document.getElementById("customerList");


  document.getElementById("customerCount")
    .textContent = customers.length;


  if (customers.length === 0) {

    list.innerHTML =
      '<div class="empty">No customers added yet.</div>';

    return;

  }


  list.innerHTML =
    customers.slice().reverse().map(customer => {

      return `
        <div class="customer">

          <div class="customer-top">

            <div>

              <div class="customer-name">
                👤 ${escapeHTML(customer.name)}
              </div>

              ${
                customer.phone
                  ? `<div class="phone">
                       📞 ${escapeHTML(customer.phone)}
                     </div>`
                  : ""
              }

            </div>

            <button
              class="delete"
              onclick="deleteCustomer(${customer.id})">
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");

}


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;

}


function goDashboard() {

  window.location.href =
    "index.html";

}


renderCustomers();

</script>

</body>
</html>
