<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanbulo Bakery - Expenses</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 20px;
      color: #3b2416;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    button {
      background: #8b4513;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .back {
      background: #ddd;
      color: #333;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .expense {
      border-top: 1px solid #eee;
      padding: 15px 0;
    }

    .expense:first-child {
      border-top: none;
    }

    .expense strong {
      font-size: 17px;
    }

    .amount {
      font-weight: bold;
      color: #8b4513;
    }

    .delete {
      background: #c0392b;
      padding: 8px 12px;
      margin-top: 8px;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      text-align: right;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Kanbulo Bakery</h1>

  <div class="top">
    <h2>Expenses</h2>
    <button onclick="showForm()">＋ Add Expense</button>
  </div>

  <button class="back" onclick="location.href='index.html'">
    ← Dashboard
  </button>

  <div id="form" class="card" style="display:none;">

    <h3>New Expense</h3>

    <label>Expense Name</label>
    <input id="name" type="text" placeholder="Example: Flour">

    <label>Amount (MVR)</label>
    <input id="amount" type="number" step="0.01" placeholder="Example: 500">

    <button onclick="addExpense()">Save Expense</button>

  </div>

  <div class="card">

    <h3>Expense List</h3>

    <div id="expenseList"></div>

    <div class="total">
      Total Expenses: MVR <span id="total">0.00</span>
    </div>

  </div>

</div>

<script>

const STORAGE_KEY = "kanbulo_expenses";

function getExpenses() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (error) {
    return [];
  }
}

function saveExpenses(expenses) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
}

function showForm() {
  document.getElementById("form").style.display = "block";
  document.getElementById("name").focus();
}

function addExpense() {

  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!name) {
    alert("Please enter the expense name.");
    return;
  }

  if (!amount || amount <= 0) {
    alert("Please enter a valid amount.");
    return;
  }

  const expenses = getExpenses();

  expenses.push({
    id: Date.now(),
    name: name,
    amount: amount,
    date: new Date().toLocaleDateString()
  });

  saveExpenses(expenses);

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("form").style.display = "none";

  displayExpenses();
}

function deleteExpense(id) {

  if (!confirm("Delete this expense?")) {
    return;
  }

  const expenses = getExpenses().filter(expense => expense.id !== id);

  saveExpenses(expenses);

  displayExpenses();
}

function displayExpenses() {

  const expenses = getExpenses();
  const list = document.getElementById("expenseList");

  if (expenses.length === 0) {
    list.innerHTML = '<div class="empty">No expenses recorded yet.</div>';
    document.getElementById("total").textContent = "0.00";
    return;
  }

  let total = 0;

  list.innerHTML = expenses.slice().reverse().map(expense => {

    total += Number(expense.amount);

    return `
      <div class="expense">
        <strong>${escapeHtml(expense.name)}</strong>
        <br>
        <small>${expense.date}</small>
        <br>
        <span class="amount">
          MVR ${Number(expense.amount).toFixed(2)}
        </span>
        <br>
        <button class="delete" onclick="deleteExpense(${expense.id})">
          Delete
        </button>
      </div>
    `;

  }).join("");

  document.getElementById("total").textContent = total.toFixed(2);
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

displayExpenses();

</script>

</body>
</html>
