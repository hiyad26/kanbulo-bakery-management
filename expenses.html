<body>

<div class="container">

  <h1>🥐 Kanbulo Bakery</h1>

  <div class="top">
    <h2>Expenses</h2>
    <button onclick="showForm()">＋ Add Expense</button>
  </div>

  <button class="back" onclick="location.href='index.html'">
    ← Dashboard
  </button>


  <!-- EXPENSE FORM -->

  <div id="form" class="card" style="display:none;">

    <h3 id="formTitle" class="form-title">
      New Expense
    </h3>

    <label for="name">
      Expense Name
    </label>

    <input
      id="name"
      type="text"
      placeholder="Example: Flour"
    >


    <label for="amount">
      Amount (MVR)
    </label>

    <input
      id="amount"
      type="number"
      min="0"
      step="0.01"
      placeholder="Example: 500"
    >


    <label for="expenseDate">
      📅 Date
    </label>

    <input
      id="expenseDate"
      type="date"
    >


    <div class="form-buttons">

      <button onclick="saveExpense()">
        💾 Save Expense
      </button>

      <button
        id="cancelButton"
        class="cancel"
        onclick="cancelEdit()"
      >
        Cancel
      </button>

    </div>

  </div>


  <!-- EXPENSE LIST -->

  <div class="card">

    <h3>Expense List</h3>

    <div id="expenseList"></div>

    <div class="total">
      Total Expenses:
      MVR <span id="total">0.00</span>
    </div>

  </div>

</div>


<script>

const STORAGE_KEY = "kanbulo_expenses";

let editingId = null;


/*
  GET EXPENSES
*/

function getExpenses() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch (error) {

    return [];

  }

}


/*
  SAVE EXPENSES
*/

function saveExpenses(expenses) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(expenses)
  );

}


/*
  TODAY AS YYYY-MM-DD
*/

function todayKey() {

  const date = new Date();

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;

}


/*
  SHOW ADD FORM
*/

function showForm() {

  editingId = null;

  document.getElementById(
    "formTitle"
  ).textContent =
    "New Expense";

  document.getElementById(
    "name"
  ).value = "";

  document.getElementById(
    "amount"
  ).value = "";

  document.getElementById(
    "expenseDate"
  ).value =
    todayKey();

  document.getElementById(
    "form"
  ).style.display =
    "block";

  document.getElementById(
    "name"
  ).focus();

}


/*
  SAVE NEW OR EDITED EXPENSE
*/

function saveExpense() {

  const name =
    document.getElementById(
      "name"
    ).value.trim();

  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );

  const date =
    document.getElementById(
      "expenseDate"
    ).value;


  if (!name) {

    alert(
      "Please enter the expense name."
    );

    return;

  }


  if (!amount || amount <= 0) {

    alert(
      "Please enter a valid amount."
    );

    return;

  }


  if (!date) {

    alert(
      "Please select the expense date."
    );

    return;

  }


  const expenses =
    getExpenses();


  /*
    EDIT EXISTING
  */

  if (editingId !== null) {

    const index =
      expenses.findIndex(
        expense =>
          String(expense.id)
          === String(editingId)
      );


    if (index !== -1) {

      expenses[index].name =
        name;

      expenses[index].amount =
        amount;

      expenses[index].date =
        date;

    }

  }

  /*
    ADD NEW
  */

  else {

    expenses.push({

      id:
        Date.now(),

      name:
        name,

      amount:
        amount,

      date:
        date

    });

  }


  saveExpenses(
    expenses
  );


  cancelEdit();

  displayExpenses();

}


/*
  EDIT EXPENSE
*/

function editExpense(id) {

  const expenses =
    getExpenses();


  const expense =
    expenses.find(
      item =>
        String(item.id)
        === String(id)
    );


  if (!expense) {

    alert(
      "Expense not found."
    );

    return;

  }


  editingId =
    id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Expense";


  document.getElementById(
    "name"
  ).value =
    expense.name || "";


  document.getElementById(
    "amount"
  ).value =
    Number(
      expense.amount || 0
    );


  document.getElementById(
    "expenseDate"
  ).value =
    normalizeExpenseDate(
      expense.date
    );


  document.getElementById(
    "form"
  ).style.display =
    "block";


  document.getElementById(
    "name"
  ).focus();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/*
  DELETE EXPENSE
*/

function deleteExpense(id) {

  const expenses =
    getExpenses();


  const expense =
    expenses.find(
      item =>
        String(item.id)
        === String(id)
    );


  if (!expense) return;


  const confirmed =
    confirm(
      "Delete this expense?\n\n" +
      expense.name +
      " — MVR " +
      Number(
        expense.amount || 0
      ).toFixed(2)
    );


  if (!confirmed) return;


  const filtered =
    expenses.filter(
      item =>
        String(item.id)
        !== String(id)
    );


  saveExpenses(
    filtered
  );


  displayExpenses();

}


/*
  CANCEL FORM
*/

function cancelEdit() {

  editingId = null;

  document.getElementById(
    "form"
  ).style.display =
    "none";

  document.getElementById(
    "name"
  ).value = "";

  document.getElementById(
    "amount"
  ).value = "";

  document.getElementById(
    "expenseDate"
  ).value =
    todayKey();

}


/*
  NORMALIZE OLD / NEW DATES
*/

function normalizeExpenseDate(value) {

  if (!value) {
    return todayKey();
  }


  /*
    Already YYYY-MM-DD
  */

  if (
    /^\d{4}-\d{2}-\d{2}$/.test(
      String(value)
    )
  ) {

    return String(value);

  }


  /*
    Try normal Date parsing
  */

  const parsed =
    new Date(value);


  if (
    !isNaN(
      parsed.getTime()
    )
  ) {

    const year =
      parsed.getFullYear();

    const month =
      String(
        parsed.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        parsed.getDate()
      ).padStart(2, "0");

    return `${year}-${month}-${day}`;

  }


  return todayKey();

}


/*
  DISPLAY-FRIENDLY DATE
*/

function displayDate(value) {

  const normalized =
    normalizeExpenseDate(
      value
    );


  const date =
    new Date(
      normalized + "T00:00:00"
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return escapeHtml(
      String(value || "")
    );

  }


  return date.toLocaleDateString(
    undefined,
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


/*
  DISPLAY EXPENSES
*/

function displayExpenses() {

  const expenses =
    getExpenses();


  const list =
    document.getElementById(
      "expenseList"
    );


  if (
    expenses.length === 0
  ) {

    list.innerHTML =
      '<div class="empty">No expenses recorded yet.</div>';

    document.getElementById(
      "total"
    ).textContent =
      "0.00";

    return;

  }


  let total = 0;


  expenses.forEach(
    expense => {

      total +=
        Number(
          expense.amount || 0
        );

    }
  );


  list.innerHTML =
    expenses
      .slice()
      .reverse()
      .map(
        expense => {

          return `

            <div class="expense">

              <strong>
                ${escapeHtml(
                  expense.name || ""
                )}
              </strong>

              <br>

              <span class="expense-date">
                📅 ${displayDate(
                  expense.date
                )}
              </span>

              <br>

              <span class="amount">
                MVR ${Number(
                  expense.amount || 0
                ).toFixed(2)}
              </span>

              <br>

              <button
                class="edit"
                onclick="editExpense('${String(
                  expense.id
                ).replace(/'/g, "\\'")}')"
              >
                ✏️ Edit
              </button>

              <button
                class="delete"
                onclick="deleteExpense('${String(
                  expense.id
                ).replace(/'/g, "\\'")}')"
              >
                🗑️ Delete
              </button>

            </div>

          `;

        }
      )
      .join("");


  document.getElementById(
    "total"
  ).textContent =
    total.toFixed(2);

}


/*
  ESCAPE HTML
*/

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(text);

  return div.innerHTML;

}


/*
  START
*/

document.getElementById(
  "expenseDate"
).value =
  todayKey();

displayExpenses();

</script>

</body>
</html>
