<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7B1E2B">

  <title>Kanbulo Bakery - Expenses</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 20px;
      color: #3b2416;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
      color: #7B1E2B;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      background: #7B1E2B;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .back {
      background: #ddd;
      color: #333;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .form-title {
      color: #7B1E2B;
      margin-top: 0;
    }

    .date-box {
      background: #fff8f0;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .date-box input {
      margin-bottom: 0;
    }

    .item-row {
      display: grid;
      grid-template-columns: 1fr 150px 45px;
      gap: 8px;
      align-items: end;
      margin-bottom: 10px;
    }

    .item-row input {
      margin: 0;
    }

    .remove-item {
      background: #c0392b;
      padding: 11px 10px;
      font-size: 18px;
    }

    .add-item {
      background: #3b2415;
      width: 100%;
      margin-top: 5px;
    }

    .grand-total {
      background: #fff8f0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      color: #7B1E2B;
    }

    .form-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .save-all {
      flex: 1;
    }

    .cancel {
      background: #ddd;
      color: #333;
      flex: 1;
    }

    .expense {
      border-top: 1px solid #eee;
      padding: 15px 0;
    }

    .expense:first-child {
      border-top: none;
    }

    .expense strong {
      font-size: 17px;
    }

    .amount {
      font-weight: bold;
      color: #7B1E2B;
      font-size: 17px;
    }

    .expense-date {
      color: #777;
      font-size: 14px;
    }

    .edit {
      background: #3b2415;
      padding: 8px 12px;
      margin-top: 9px;
      margin-right: 6px;
    }

    .delete {
      background: #c0392b;
      padding: 8px 12px;
      margin-top: 9px;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      text-align: right;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #7B1E2B;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .day-total {
      background: #f8eee7;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      color: #7B1E2B;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .top {
        align-items: stretch;
        flex-direction: column;
      }

      .top button {
        width: 100%;
      }

      .item-row {
        grid-template-columns: 1fr 110px 42px;
      }

      .form-buttons {
        flex-direction: column;
      }

      .cancel {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🥐 Kanbulo Bakery</h1>

  <div class="top">
    <h2>Expenses</h2>

    <button onclick="showForm()">
      ＋ Add Expenses
    </button>
  </div>

  <button class="back" onclick="location.href='index.html'">
    ← Dashboard
  </button>


  <!-- MULTIPLE EXPENSE FORM -->

  <div id="form" class="card" style="display:none;">

    <h3 class="form-title">
      🧾 Add Multiple Expenses
    </h3>

    <div class="date-box">

      <label for="expenseDate">
        📅 Expense Date
      </label>

      <input
        id="expenseDate"
        type="date"
        onchange="updateFormTotal()"
      >

    </div>


    <div id="expenseItems"></div>


    <button
      class="add-item"
      onclick="addExpenseItem()"
    >
      ＋ Add Another Item
    </button>


    <div class="grand-total">
      Total:
      MVR <span id="formTotal">0.00</span>
    </div>


    <div class="form-buttons">

      <button
        class="save-all"
        onclick="saveAllExpenses()"
      >
        💾 Save All Expenses
      </button>

      <button
        class="cancel"
        onclick="cancelForm()"
      >
        Cancel
      </button>

    </div>

  </div>


  <!-- EXPENSE LIST -->

  <div class="card">

    <h3>Expense List</h3>

    <div id="expenseList"></div>

    <div class="total">
      Total Expenses:
      MVR <span id="total">0.00</span>
    </div>

  </div>

</div>


<script>

const STORAGE_KEY =
  "kanbulo_expenses";

let editingId = null;


/*
  GET EXPENSES
*/

function getExpenses() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch (error) {

    return [];

  }

}


/*
  SAVE EXPENSES
*/

function saveExpenses(expenses) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(expenses)
  );

}


/*
  TODAY
*/

function todayKey() {

  const date =
    new Date();

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;

}


/*
  SHOW MULTIPLE EXPENSE FORM
*/

function showForm() {

  editingId = null;

  document.getElementById(
    "expenseDate"
  ).value = todayKey();

  document.getElementById(
    "expenseItems"
  ).innerHTML = "";

  addExpenseItem();

  document.getElementById(
    "form"
  ).style.display = "block";

  updateFormTotal();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/*
  ADD ANOTHER EXPENSE ITEM
*/

function addExpenseItem(
  name = "",
  amount = ""
) {

  const container =
    document.getElementById(
      "expenseItems"
    );

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "item-row";

  row.innerHTML = `

    <input
      type="text"
      class="expense-name"
      placeholder="Expense name"
      value="${escapeAttribute(name)}"
      oninput="updateFormTotal()"
    >

    <input
      type="number"
      class="expense-amount"
      min="0"
      step="0.01"
      placeholder="MVR 0.00"
      value="${amount}"
      oninput="updateFormTotal()"
    >

    <button
      type="button"
      class="remove-item"
      onclick="removeExpenseItem(this)"
      title="Remove"
    >
      ×
    </button>

  `;

  container.appendChild(
    row
  );

  const names =
    container.querySelectorAll(
      ".expense-name"
    );

  names[names.length - 1].focus();

  updateFormTotal();

}


/*
  REMOVE EXPENSE ITEM
*/

function removeExpenseItem(button) {

  const container =
    document.getElementById(
      "expenseItems"
    );

  const rows =
    container.querySelectorAll(
      ".item-row"
    );


  if (rows.length === 1) {

    rows[0]
      .querySelector(
        ".expense-name"
      ).value = "";

    rows[0]
      .querySelector(
        ".expense-amount"
      ).value = "";

  } else {

    button
      .closest(
        ".item-row"
      )
      .remove();

  }


  updateFormTotal();

}


/*
  CALCULATE FORM TOTAL
*/

function updateFormTotal() {

  const amounts =
    document.querySelectorAll(
      ".expense-amount"
    );

  let total = 0;


  amounts.forEach(
    input => {

      total +=
        Number(
          input.value || 0
        );

    }
  );


  document.getElementById(
    "formTotal"
  ).textContent =
    total.toFixed(2);

}


/*
  SAVE ALL EXPENSES
*/

function saveAllExpenses() {

  const date =
    document.getElementById(
      "expenseDate"
    ).value;


  if (!date) {

    alert(
      "Please select the expense date."
    );

    return;

  }


  const rows =
    document.querySelectorAll(
      ".item-row"
    );


  const newExpenses = [];


  for (
    const row of rows
  ) {

    const name =
      row.querySelector(
        ".expense-name"
      ).value.trim();

    const amount =
      Number(
        row.querySelector(
          ".expense-amount"
        ).value || 0
      );


    /*
      Completely empty row
      is ignored.
    */

    if (
      !name &&
      !amount
    ) {

      continue;

    }


    if (!name) {

      alert(
        "Please enter a name for every expense item."
      );

      return;

    }


    if (
      !amount ||
      amount <= 0
    ) {

      alert(
        "Please enter a valid amount for: " +
        name
      );

      return;

    }


    newExpenses.push({

      id:
        Date.now() +
        Math.random(),

      name:
        name,

      amount:
        amount,

      date:
        date

    });

  }


  if (
    newExpenses.length === 0
  ) {

    alert(
      "Please add at least one expense."
    );

    return;

  }


  const expenses =
    getExpenses();


  /*
    ADD ALL ITEMS
  */

  newExpenses.forEach(
    expense => {

      expenses.push(
        expense
      );

    }
  );


  saveExpenses(
    expenses
  );


  cancelForm();

  displayExpenses();


  alert(
    newExpenses.length +
    " expense item" +
    (
      newExpenses.length === 1
        ? ""
        : "s"
    ) +
    " saved successfully! ❤️"
  );

}


/*
  EDIT ONE EXPENSE
*/

function editExpense(id) {

  const expenses =
    getExpenses();


  const expense =
    expenses.find(
      item =>
        String(item.id)
        === String(id)
    );


  if (!expense) {

    alert(
      "Expense not found."
    );

    return;

  }


  editingId =
    id;


  document.getElementById(
    "expenseDate"
  ).value =
    normalizeExpenseDate(
      expense.date
    );


  document.getElementById(
    "expenseItems"
  ).innerHTML = "";


  addExpenseItem(
    expense.name || "",
    Number(
      expense.amount || 0
    )
  );


  /*
    Change save button
    temporarily to edit.
  */

  const saveButton =
    document.querySelector(
      ".save-all"
    );

  saveButton.textContent =
    "💾 Save Changes";

  saveButton.onclick =
    saveEditedExpense;


  document.getElementById(
    "form"
  ).style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/*
  SAVE EDITED EXPENSE
*/

function saveEditedExpense() {

  if (editingId === null) {
    return;
  }


  const name =
    document.querySelector(
      ".expense-name"
    ).value.trim();

  const amount =
    Number(
      document.querySelector(
        ".expense-amount"
      ).value || 0
    );

  const date =
    document.getElementById(
      "expenseDate"
    ).value;


  if (!name) {

    alert(
      "Please enter the expense name."
    );

    return;

  }


  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "Please enter a valid amount."
    );

    return;

  }


  if (!date) {

    alert(
      "Please select the expense date."
    );

    return;

  }


  const expenses =
    getExpenses();


  const index =
    expenses.findIndex(
      expense =>
        String(expense.id)
        === String(editingId)
    );


  if (index === -1) {

    alert(
      "Expense not found."
    );

    return;

  }


  expenses[index].name =
    name;

  expenses[index].amount =
    amount;

  expenses[index].date =
    date;


  saveExpenses(
    expenses
  );


  cancelForm();

  displayExpenses();

}


/*
  DELETE EXPENSE
*/

function deleteExpense(id) {

  const expenses =
    getExpenses();


  const expense =
    expenses.find(
      item =>
        String(item.id)
        === String(id)
    );


  if (!expense) return;


  const confirmed =
    confirm(
      "Delete this expense?\n\n" +
      expense.name +
      " — MVR " +
      Number(
        expense.amount || 0
      ).toFixed(2)
    );


  if (!confirmed) return;


  const filtered =
    expenses.filter(
      item =>
        String(item.id)
        !== String(id)
    );


  saveExpenses(
    filtered
  );


  displayExpenses();

}


/*
  CANCEL FORM
*/

function cancelForm() {

  editingId = null;


  document.getElementById(
    "form"
  ).style.display =
    "none";


  document.getElementById(
    "expenseItems"
  ).innerHTML = "";


  document.getElementById(
    "expenseDate"
  ).value =
    todayKey();


  /*
    Restore save button
  */

  const saveButton =
    document.querySelector(
      ".save-all"
    );

  saveButton.textContent =
    "💾 Save All Expenses";

  saveButton.onclick =
    saveAllExpenses;


  updateFormTotal();

}


/*
  NORMALIZE DATE
*/

function normalizeExpenseDate(
  value
) {

  if (!value) {

    return todayKey();

  }


  if (
    /^\d{4}-\d{2}-\d{2}$/.test(
      String(value)
    )
  ) {

    return String(value);

  }


  const parsed =
    new Date(value);


  if (
    !isNaN(
      parsed.getTime()
    )
  ) {

    const year =
      parsed.getFullYear();

    const month =
      String(
        parsed.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        parsed.getDate()
      ).padStart(2, "0");


    return `${year}-${month}-${day}`;

  }


  return todayKey();

}


/*
  DISPLAY DATE
*/

function displayDate(value) {

  const normalized =
    normalizeExpenseDate(
      value
    );


  const date =
    new Date(
      normalized +
      "T00:00:00"
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return escapeHtml(
      String(
        value || ""
      )
    );

  }


  return date.toLocaleDateString(
    undefined,
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


/*
  DISPLAY EXPENSES
*/

function displayExpenses() {

  const expenses =
    getExpenses();


  const list =
    document.getElementById(
      "expenseList"
    );


  if (
    expenses.length === 0
  ) {

    list.innerHTML =
      '<div class="empty">No expenses recorded yet.</div>';

    document.getElementById(
      "total"
    ).textContent =
      "0.00";

    return;

  }


  let total = 0;


  expenses.forEach(
    expense => {

      total +=
        Number(
          expense.amount || 0
        );

    }
  );


  list.innerHTML =
    expenses
      .slice()
      .reverse()
      .map(
        expense => {

          return `

            <div class="expense">

              <strong>
                ${escapeHtml(
                  expense.name || ""
                )}
              </strong>

              <br>

              <span class="expense-date">
                📅 ${displayDate(
                  expense.date
                )}
              </span>

              <br>

              <span class="amount">
                MVR ${Number(
                  expense.amount || 0
                ).toFixed(2)}
              </span>

              <br>

              <button
                class="edit"
                onclick="editExpense('${escapeAttribute(
                  String(expense.id)
                )}')"
              >
                ✏️ Edit
              </button>

              <button
                class="delete"
                onclick="deleteExpense('${escapeAttribute(
                  String(expense.id)
                )}')"
              >
                🗑️ Delete
              </button>

            </div>

          `;

        }
      )
      .join("");


  document.getElementById(
    "total"
  ).textContent =
    total.toFixed(2);

}


/*
  ESCAPE HTML
*/

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(text);

  return div.innerHTML;

}


/*
  ESCAPE ATTRIBUTE
*/

function escapeAttribute(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/*
  START
*/

document.getElementById(
  "expenseDate"
).value =
  todayKey();

displayExpenses();

</script>

</body>
</html>
