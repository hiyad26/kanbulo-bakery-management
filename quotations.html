<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B4513">

  <title>Kanbulo Bakery - Quotations</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #3b2415;
    }

    header {
      background: #8B4513;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .back {
      background: #eee;
      color: #333;
      border: none;
      border-radius: 9px;
      padding: 11px 15px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    h3 {
      margin-bottom: 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 10px;
      align-items: end;
    }

    .add {
      width: 100%;
      background: #8B4513;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      margin-top: 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .quotation-header {
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .quotation-number {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .date {
      color: #777;
      font-size: 14px;
    }

    .customer-info {
      background: #fff8f0;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr 70px 90px 35px;
      gap: 8px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item-name {
      font-weight: bold;
    }

    .item-total {
      text-align: right;
    }

    .remove {
      background: #f3d6d6;
      color: #900;
      border: none;
      border-radius: 7px;
      padding: 7px;
      cursor: pointer;
    }

    .total {
      text-align: right;
      font-size: 21px;
      font-weight: bold;
      margin-top: 18px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .save {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      cursor: pointer;
    }

    .print {
      background: #555;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      cursor: pointer;
    }

    .empty {
      background: #fff;
      text-align: center;
      color: #777;
      padding: 30px 15px;
      border-radius: 15px;
    }

    /* SAVED QUOTATIONS */

    .saved-quotation {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fffaf5;
    }

    .saved-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .saved-number {
      font-weight: bold;
      font-size: 17px;
    }

    .saved-total {
      font-weight: bold;
      font-size: 17px;
    }

    .saved-customer {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .saved-date {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .saved-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
    }

    .view-btn,
    .print-btn,
    .delete-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .view-btn {
      background: #e8dccf;
      color: #3b2415;
    }

    .print-btn {
      background: #555;
      color: white;
    }

    .delete-btn {
      background: #f3d6d6;
      color: #900;
    }

    .details {
      display: none;
      margin-top: 12px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }

    .details.show {
      display: block;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
    }

    .saved-count {
      background: #8B4513;
      color: white;
      display: inline-block;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 13px;
      margin-left: 5px;
    }

    @media (max-width: 600px) {

      .row {
        grid-template-columns: 1fr;
      }

      .item {
        grid-template-columns: 1fr 60px 80px 35px;
        font-size: 14px;
      }

      .saved-top {
        align-items: flex-start;
      }

      .saved-actions {
        grid-template-columns: 1fr 1fr 1fr;
      }

    }

    @media print {

      .back,
      .form-box,
      .actions,
      .saved-box {
        display: none !important;
      }

      body {
        background: white;
      }

      .box {
        box-shadow: none;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Quotations</p>
</header>

<main>

  <button class="back" onclick="goDashboard()">
    ← Dashboard
  </button>

  <h2>📝 Quotations</h2>

  <!-- CREATE QUOTATION -->

  <div class="box form-box">

    <h3>➕ Create New Quotation</h3>

    <label for="customer">
      Customer
    </label>

    <select id="customer">
      <option value="">Walk-in / Select Customer</option>
    </select>

    <div class="row">

      <div>

        <label for="product">
          Product
        </label>

        <select id="product">
          <option value="">Select Product</option>
        </select>

      </div>

      <div>

        <label for="quantity">
          Quantity
        </label>

        <input
          id="quantity"
          type="number"
          min="1"
          value="1"
        >

      </div>

    </div>

    <button class="add" onclick="addItem()">
      ＋ Add Product
    </button>

  </div>


  <!-- CURRENT QUOTATION -->

  <div class="box">

    <h3>📄 Current Quotation</h3>

    <div class="quotation-header">

      <div class="quotation-number">
        Quotation No:
        <span id="quotationNumber"></span>
      </div>

      <div class="date" id="quotationDate"></div>

    </div>

    <div class="customer-info">

      <strong>Customer:</strong>

      <span id="selectedCustomer">
        Walk-in Customer
      </span>

    </div>

    <div id="itemsList">

      <div class="empty">
        No products added yet.
      </div>

    </div>

    <div class="total">

      Total:
      MVR <span id="grandTotal">0.00</span>

    </div>

    <div class="actions">

      <button class="save" onclick="saveQuotation()">
        💾 Save Quotation
      </button>

      <button class="print" onclick="window.print()">
        🖨️ Print
      </button>

    </div>

  </div>


  <!-- SAVED QUOTATIONS -->

  <div class="box saved-box">

    <h3>
      📋 Saved Quotations
      <span class="saved-count" id="savedCount">0</span>
    </h3>

    <div id="savedQuotations">

      <div class="empty">
        No saved quotations yet.
      </div>

    </div>

  </div>

</main>


<script>

const PRODUCTS_KEY = "kanbulo_products";
const CUSTOMERS_KEY = "kanbulo_customers";
const QUOTATIONS_KEY = "kanbulo_quotations";

let items = [];


/* GET DATA */

function getData(key) {

  try {

    const saved =
      localStorage.getItem(key);

    const data =
      saved
        ? JSON.parse(saved)
        : [];

    return Array.isArray(data)
      ? data
      : [];

  } catch (error) {

    return [];

  }

}


/* LOAD CUSTOMERS */

function loadCustomers() {

  const customers =
    getData(CUSTOMERS_KEY);

  const select =
    document.getElementById("customer");

  select.innerHTML =
    '<option value="">Walk-in / Select Customer</option>';

  customers.forEach(customer => {

    const option =
      document.createElement("option");

    option.value =
      customer.id;

    option.textContent =
      customer.name +
      (
        customer.phone
          ? " - " + customer.phone
          : ""
      );

    select.appendChild(option);

  });

}


/* LOAD PRODUCTS */

function loadProducts() {

  const products =
    getData(PRODUCTS_KEY);

  const select =
    document.getElementById("product");

  select.innerHTML =
    '<option value="">Select Product</option>';

  products.forEach(product => {

    const option =
      document.createElement("option");

    option.value =
      product.id;

    option.textContent =
      product.name +
      " — MVR " +
      Number(product.price).toFixed(2);

    select.appendChild(option);

  });

}


/* QUOTATION NUMBER */

function generateQuotationNumber() {

  const number =
    Date.now()
      .toString()
      .slice(-6);

  document.getElementById(
    "quotationNumber"
  ).textContent =
    "QT-" + number;

}


/* DATE */

function setDate() {

  document.getElementById(
    "quotationDate"
  ).textContent =
    new Date().toLocaleString();

}


/* ADD ITEM */

function addItem() {

  const productId =
    document.getElementById(
      "product"
    ).value;

  const quantity =
    Number(
      document.getElementById(
        "quantity"
      ).value
    );

  if (!productId) {

    alert(
      "Please select a product."
    );

    return;

  }

  if (!quantity || quantity < 1) {

    alert(
      "Please enter a valid quantity."
    );

    return;

  }

  const products =
    getData(PRODUCTS_KEY);

  const product =
    products.find(
      p =>
        Number(p.id) ===
        Number(productId)
    );

  if (!product) {

    alert(
      "Product not found."
    );

    return;

  }

  const existing =
    items.find(
      item =>
        Number(item.productId) ===
        Number(productId)
    );

  if (existing) {

    existing.quantity +=
      quantity;

    existing.total =
      existing.quantity *
      Number(existing.price);

  } else {

    items.push({

      productId:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      quantity:
        quantity,

      total:
        Number(product.price) *
        quantity

    });

  }

  document.getElementById(
    "quantity"
  ).value = 1;

  renderItems();

}


/* REMOVE ITEM */

function removeItem(index) {

  items.splice(index, 1);

  renderItems();

}


/* RENDER CURRENT ITEMS */

function renderItems() {

  const list =
    document.getElementById(
      "itemsList"
    );

  if (items.length === 0) {

    list.innerHTML =
      '<div class="empty">No products added yet.</div>';

    document.getElementById(
      "grandTotal"
    ).textContent =
      "0.00";

    return;

  }

  let total = 0;

  list.innerHTML =
    items.map(
      (item, index) => {

        total +=
          Number(item.total);

        return `

          <div class="item">

            <div class="item-name">
              ${escapeHTML(item.name)}
            </div>

            <div>
              × ${item.quantity}
            </div>

            <div class="item-total">
              MVR
              ${Number(item.total).toFixed(2)}
            </div>

            <button
              class="remove"
              onclick="removeItem(${index})">
              ×
            </button>

          </div>

        `;

      }
    ).join("");

  document.getElementById(
    "grandTotal"
  ).textContent =
    total.toFixed(2);

}


/* CUSTOMER DISPLAY */

function updateCustomerDisplay() {

  const customerId =
    document.getElementById(
      "customer"
    ).value;

  const customers =
    getData(CUSTOMERS_KEY);

  const customer =
    customers.find(
      c =>
        Number(c.id) ===
        Number(customerId)
    );

  document.getElementById(
    "selectedCustomer"
  ).textContent =
    customer
      ? customer.name +
        (
          customer.phone
            ? " — " + customer.phone
            : ""
        )
      : "Walk-in Customer";

}


/* SAVE QUOTATION */

function saveQuotation() {

  if (items.length === 0) {

    alert(
      "Please add at least one product."
    );

    return;

  }

  const quotations =
    getData(QUOTATIONS_KEY);

  const customerId =
    document.getElementById(
      "customer"
    ).value;

  const customers =
    getData(CUSTOMERS_KEY);

  const customer =
    customers.find(
      c =>
        Number(c.id) ===
        Number(customerId)
    );

  const total =
    items.reduce(
      (sum, item) =>
        sum + Number(item.total),
      0
    );

  const quotation = {

    id:
      Date.now(),

    quotationNumber:
      document.getElementById(
        "quotationNumber"
      ).textContent,

    date:
      new Date().toISOString(),

    customerId:
      customer
        ? customer.id
        : null,

    customerName:
      customer
        ? customer.name
        : "Walk-in Customer",

    customerPhone:
      customer
        ? customer.phone
        : "",

    items:
      items.map(
        item => ({

          productId:
            item.productId,

          name:
            item.name,

          price:
            item.price,

          quantity:
            item.quantity,

          total:
            item.total

        })
      ),

    total:
      total

  };


  quotations.push(
    quotation
  );

  localStorage.setItem(
    QUOTATIONS_KEY,
    JSON.stringify(quotations)
  );


  alert(
    "Quotation " +
    quotation.quotationNumber +
    " saved successfully!"
  );


  /* REFRESH SAVED LIST */

  renderSavedQuotations();

}


/* SHOW SAVED QUOTATIONS */

function renderSavedQuotations() {

  const quotations =
    getData(QUOTATIONS_KEY);

  const container =
    document.getElementById(
      "savedQuotations"
    );

  const count =
    document.getElementById(
      "savedCount"
    );

  count.textContent =
    quotations.length;


  if (quotations.length === 0) {

    container.innerHTML =
      '<div class="empty">No saved quotations yet.</div>';

    return;

  }


  const latest =
    [...quotations].reverse();


  container.innerHTML =
    latest.map(
      quotation => {

        const customer =
          quotation.customerName ||
          "Walk-in Customer";

        const phone =
          quotation.customerPhone ||
          "";

        const date =
          new Date(
            quotation.date
          ).toLocaleString();

        return `

          <div
            class="saved-quotation"
            id="saved-${quotation.id}">

            <div class="saved-top">

              <div class="saved-number">
                ${escapeHTML(
                  quotation.quotationNumber
                )}
              </div>

              <div class="saved-total">
                MVR
                ${Number(
                  quotation.total
                ).toFixed(2)}
              </div>

            </div>

            <div class="saved-customer">

              👤
              ${escapeHTML(customer)}

              ${
                phone
                  ? " — " +
                    escapeHTML(phone)
                  : ""
              }

            </div>

            <div class="saved-date">
              📅 ${escapeHTML(date)}
            </div>

            <div class="saved-actions">

              <button
                class="view-btn"
                onclick="toggleDetails(${quotation.id})">
                👁️ View
              </button>

              <button
                class="print-btn"
                onclick="printQuotation(${quotation.id})">
                🖨️ Print
              </button>

              <button
                class="delete-btn"
                onclick="deleteQuotation(${quotation.id})">
                🗑️ Delete
              </button>

            </div>

            <div
              class="details"
              id="details-${quotation.id}">

              ${
                quotation.items &&
                quotation.items.length
                  ? quotation.items.map(
                      item => `

                        <div class="detail-item">

                          <span>
                            ${escapeHTML(
                              item.name
                            )}
                            × ${item.quantity}
                          </span>

                          <strong>
                            MVR
                            ${Number(
                              item.total
                            ).toFixed(2)}
                          </strong>

                        </div>

                      `
                    ).join("")
                  : ""
              }

              <div
                class="detail-item"
                style="border-top:1px solid #ddd; margin-top:8px; padding-top:10px;">

                <strong>
                  Total
                </strong>

                <strong>
                  MVR
                  ${Number(
                    quotation.total
                  ).toFixed(2)}
                </strong>

              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* VIEW DETAILS */

function toggleDetails(id) {

  const box =
    document.getElementById(
      "details-" + id
    );

  if (!box) return;

  box.classList.toggle(
    "show"
  );

}


/* PRINT SAVED QUOTATION */

function printQuotation(id) {

  const quotations =
    getData(QUOTATIONS_KEY);

  const quotation =
    quotations.find(
      q =>
        Number(q.id) ===
        Number(id)
    );

  if (!quotation) {

    alert(
      "Quotation not found."
    );

    return;

  }


  const date =
    new Date(
      quotation.date
    ).toLocaleString();


  const itemsHTML =
    (quotation.items || [])
      .map(
        item => `

          <tr>

            <td>
              ${escapeHTML(item.name)}
            </td>

            <td>
              ${item.quantity}
            </td>

            <td>
              MVR
              ${Number(
                item.price
              ).toFixed(2)}
            </td>

            <td>
              MVR
              ${Number(
                item.total
              ).toFixed(2)}
            </td>

          </tr>

        `
      ).join("");


  const printWindow =
    window.open(
      "",
      "_blank"
    );

  if (!printWindow) {

    alert(
      "Please allow pop-ups to print the quotation."
    );

    return;

  }


  printWindow.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>
        ${escapeHTML(
          quotation.quotationNumber
        )}
      </title>

      <style>

        body {
          font-family: Arial, sans-serif;
          padding: 30px;
          color: #222;
        }

        h1 {
          color: #8B4513;
          margin-bottom: 5px;
        }

        h2 {
          margin-top: 25px;
        }

        .line {
          border-bottom: 1px solid #ddd;
          margin: 15px 0;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 20px;
        }

        th,
        td {
          border: 1px solid #ddd;
          padding: 10px;
          text-align: left;
        }

        th {
          background: #f5eee8;
        }

        .total {
          text-align: right;
          font-size: 20px;
          font-weight: bold;
          margin-top: 20px;
        }

      </style>

    </head>

    <body>

      <h1>
        🥐 Kanbulo Bakery
      </h1>

      <h2>
        QUOTATION
      </h2>

      <div>
        <strong>
          Quotation No:
        </strong>
        ${escapeHTML(
          quotation.quotationNumber
        )}
      </div>

      <div>
        <strong>
          Date:
        </strong>
        ${escapeHTML(date)}
      </div>

      <div class="line"></div>

      <div>
        <strong>
          Customer:
        </strong>
        ${escapeHTML(
          quotation.customerName ||
          "Walk-in Customer"
        )}
      </div>

      ${
        quotation.customerPhone
          ? `
            <div>
              <strong>
                Phone:
              </strong>
              ${escapeHTML(
                quotation.customerPhone
              )}
            </div>
          `
          : ""
      }

      <table>

        <thead>

          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
          </tr>

        </thead>

        <tbody>

          ${itemsHTML}

        </tbody>

      </table>

      <div class="total">

        Total:
        MVR
        ${Number(
          quotation.total
        ).toFixed(2)}

      </div>

    </body>

    </html>

  `);


  printWindow.document.close();

  printWindow.focus();

  setTimeout(
    () => {
      printWindow.print();
    },
    300
  );

}


/* DELETE */

function deleteQuotation(id) {

  const quotations =
    getData(QUOTATIONS_KEY);

  const quotation =
    quotations.find(
      q =>
        Number(q.id) ===
        Number(id)
    );

  if (!quotation) return;


  const confirmed =
    confirm(
      "Delete quotation " +
      quotation.quotationNumber +
      "?"
    );

  if (!confirmed) return;


  const updated =
    quotations.filter(
      q =>
        Number(q.id) !==
        Number(id)
    );


  localStorage.setItem(
    QUOTATIONS_KEY,
    JSON.stringify(updated)
  );


  renderSavedQuotations();

}


/* ESCAPE HTML */

function escapeHTML(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(value);

  return div.innerHTML;

}


/* DASHBOARD */

function goDashboard() {

  window.location.href =
    "index.html";

}


/* CUSTOMER CHANGE */

document.getElementById(
  "customer"
).addEventListener(
  "change",
  updateCustomerDisplay
);


/* START */

loadCustomers();

loadProducts();

generateQuotationNumber();

setDate();

renderItems();

renderSavedQuotations();

</script>

</body>
</html>
