const PRODUCTS_KEY="kanbulo_products";
const CUSTOMERS_KEY="kanbulo_customers";
const QUOTATIONS_KEY="kanbulo_quotations";

let items=[];


/* ==========================================
   BAKERY INFORMATION
   ========================================== */

const BAKERY={
  name:"KANBULO BAKERY",
  tagline:"Freshly baked with love",
  location:"Daisymaage,",
  island:"N. Velidhoo",
  phone:"+960 7653140"
};


/* ==========================================
   PAYMENT INFORMATION
   ========================================== */

const PAYMENT={
  bank:"Bank of Maldives",
  accountName:"KANBULO BAKERY",
  accountNumber:"7770000049905",
  slip:"Customer will send via Viber/WhatsApp",
  slipContacts:"7653140 / 7359040"
};


/* ==========================================
   DATA
   ========================================== */

function getData(key,fallback){

  try{
    return JSON.parse(localStorage.getItem(key)) || fallback;
  }catch{
    return fallback;
  }

}


/* ==========================================
   CUSTOMERS
   ========================================== */

function loadCustomers(){

  const customers=getData(CUSTOMERS_KEY,[]);
  const select=document.getElementById("customer");

  customers.forEach(customer=>{

    const option=document.createElement("option");

    option.value=customer.id;

    option.textContent=
      customer.name+
      (customer.phone ? " - "+customer.phone : "");

    select.appendChild(option);

  });

}


/* ==========================================
   PRODUCTS
   ========================================== */

function loadProducts(){

  const products=getData(PRODUCTS_KEY,[]);
  const select=document.getElementById("product");

  products.forEach(product=>{

    const option=document.createElement("option");

    option.value=product.id;

    option.textContent=
      product.name+
      " — MVR "+
      Number(product.price).toFixed(2)+
      " — Stock: "+
      product.stock;

    select.appendChild(option);

  });

}


/* ==========================================
   QUOTATION NUMBER
   ========================================== */

function generateQuotationNumber(){

  return "QT-"+Math.floor(100000+Math.random()*900000);

}


/* ==========================================
   DATE
   ========================================== */

function setDate(){

  const now=new Date();

  document.getElementById("quotationNumber").textContent=
    generateQuotationNumber();

  document.getElementById("quotationDate").textContent=
    now.toLocaleString();

}


/* ==========================================
   ADD PRODUCT
   ========================================== */

function addItem(){

  const productId=
    Number(document.getElementById("product").value);

  const quantity=
    Number(document.getElementById("quantity").value);

  if(!productId){

    alert("Please select a product.");
    return;

  }

  if(!quantity || quantity<1){

    alert("Please enter a valid quantity.");
    return;

  }

  const products=getData(PRODUCTS_KEY,[]);

  const product=
    products.find(p=>Number(p.id)===productId);

  if(!product){

    alert("Product not found.");
    return;

  }

  const existing=
    items.find(item=>item.productId===productId);

  if(existing){

    existing.quantity+=quantity;

    existing.total=
      existing.quantity*existing.price;

  }else{

    items.push({

      productId:product.id,
      name:product.name,
      price:Number(product.price),
      quantity:quantity,
      total:Number(product.price)*quantity

    });

  }

  renderItems();

}


/* ==========================================
   REMOVE
   ========================================== */

function removeItem(index){

  items.splice(index,1);

  renderItems();

}


/* ==========================================
   RENDER ITEMS
   ========================================== */

function renderItems(){

  const container=document.getElementById("items");

  container.innerHTML="";

  let total=0;

  if(items.length===0){

    container.innerHTML=
      '<div class="empty">No products added yet.</div>';

  }

  items.forEach((item,index)=>{

    total+=item.total;

    const div=document.createElement("div");

    div.className="item";

    div.innerHTML=`

      <div>
        <strong>${escapeHTML(item.name)}</strong>
        <br>
        ${item.quantity} × MVR ${item.price.toFixed(2)}
      </div>

      <div>
        <strong>MVR ${item.total.toFixed(2)}</strong>

        <button class="danger"
          onclick="removeItem(${index})">
          ✕
        </button>
      </div>

    `;

    container.appendChild(div);

  });

  document.getElementById("total").textContent=
    total.toFixed(2);

}


/* ==========================================
   CUSTOMER DISPLAY
   ========================================== */

function updateCustomerDisplay(){

  const customerId=
    Number(document.getElementById("customer").value);

  const customers=
    getData(CUSTOMERS_KEY,[]);

  const customer=
    customers.find(c=>Number(c.id)===customerId);

  if(customer){

    document.getElementById("customerDisplay").textContent=
      "Customer: "+
      customer.name+
      (customer.phone ? " — "+customer.phone : "");

  }else{

    document.getElementById("customerDisplay").textContent=
      "Customer: Walk-in Customer";

  }

}

.getElementById("customer")

/* ==========================================
   CURRENT QUOTATION
   ========================================== */

function getCurrentQuotation(){

  const customerId=
    Number(document.getElementById("customer").value);

  const customers=
    getData(CUSTOMERS_KEY,[]);

  const customer=
    customers.find(c=>Number(c.id)===customerId);

  const total=
    items.reduce((sum,item)=>sum+item.total,0);

  return{

    id:Date.now(),

    quotationNumber:
      document.getElementById("quotationNumber").textContent,

    date:
      new Date().toISOString(),

    customerId:
      customer ? customer.id : null,

    customerName:
      customer ? customer.name : "Walk-in Customer",

    customerPhone:
      customer ? customer.phone : "",

    items:
      items.map(item=>({

        productId:item.productId,
        name:item.name,
        price:item.price,
        quantity:item.quantity,
        total:item.total

      })),

    total:total

  };

}


/* ==========================================
   SAVE QUOTATION
   ========================================== */

function saveQuotation(){

  if(items.length===0){

    alert("Please add at least one product.");
    return;

  }

  const quotation=getCurrentQuotation();

  const quotations=getData(QUOTATIONS_KEY,[]);

  quotations.push(quotation);

  localStorage.setItem(
    QUOTATIONS_KEY,
    JSON.stringify(quotations)
  );

  renderSavedQuotations();

  alert(
    "Quotation "+
    quotation.quotationNumber+
    " saved successfully!"
  );

}


/* ==========================================
   SAVED QUOTATIONS
   ========================================== */

function renderSavedQuotations(){

  const container=
    document.getElementById("savedQuotations");

  document.getElementById("savedCount").textContent=
    quotations.length;

  container.innerHTML="";

  if(quotations.length===0){

    container.innerHTML=
      '<div class="empty">No saved quotations yet.</div>';

    return;

  }

  quotations.slice().reverse().forEach(quotation=>{

    const div=document.createElement("div");

    div.className="saved";

    const date=
      new Date(quotation.date).toLocaleString();

    div.innerHTML=`

        ${escapeHTML(quotation.quotationNumber)}

      MVR ${Number(quotation.total).toFixed(2)}

      <br>

      <small>${date}</small>

          onclick="toggleDetails(${quotation.id})">

        </button>

        <button class="download"
          onclick="downloadQuotationPDF(${quotation.id})">
          📥 Save
        </button>

        <button class="print"
          onclick="printQuotation(${quotation.id})">
          🖨️ Print
        </button>

        <button class="danger"

        class="details"

        ${quotation.items.map(item=>`

          <div>

        `).join("")}

        <hr style="margin:10px 0;">

        <strong>
          Total: MVR
          ${Number(quotation.total).toFixed(2)}

    `;

    container.appendChild(div);

  });

}


/* ==========================================
   DETAILS
   ========================================== */

function toggleDetails(id){

  const box=
    document.getElementById("details-"+id);

  if(box){
    box.classList.toggle("show");

/* ==========================================
   DELETE
   ========================================== */

function deleteQuotation(id){

  if(!confirm("Delete this quotation?")){
    return;
  }

  let quotations=getData(QUOTATIONS_KEY,[]);

  quotations=
    quotations.filter(q=>q.id!==id);

  localStorage.setItem(
    QUOTATIONS_KEY,
    JSON.stringify(quotations)
  );

  renderSavedQuotations();

}

/* ==========================================
   SAVE SAVED QUOTATION
   ========================================== */

function downloadQuotationPDF(id){

  const quotations=
    getData(QUOTATIONS_KEY,[]);

  const quotation=
    quotations.find(q=>q.id===id);

  if(!quotation)return;

  downloadQuotationPDFObject(quotation);

}


/* ==========================================
   DOWNLOAD PDF
   ========================================== */

function downloadQuotationPDFObject(quotation){

  const pdf=
    createThemedQuotationPDF(quotation);

  const blob=
    new Blob(
      [pdf],
      {type:"application/pdf"}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "Kanbulo-Quotation-"+
    quotation.quotationNumber+
    ".pdf";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1500);

  alert(
    "Quotation saved to your Downloads folder."
  );

}


/* ==================================================
   CLEAN THEMED PDF GENERATOR
   ================================================== */

function createThemedQuotationPDF(quotation){

  function escapePDF(value){

    return String(value)
      .replace(/\\/g,"\\\\")
      .replace(/\(/g,"\\(")
      .replace(/\)/g,"\\)")
      .replace(/[^\x20-\x7E]/g,"?");

  }


  /* ================================================
     TEXT
     ================================================ */

  function pdfText(
    x,
    y,
    size,
    value,
    font="/F1",
    color="0.20 0.10 0.08"
  ){

    return(

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
