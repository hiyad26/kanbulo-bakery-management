<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kanbulo Bakery - Quotations</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #3b2415;
      padding-bottom: 40px;
    }

    header {
      background: #8B4513;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #8B4513;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 12px;
    }

    .primary {
      background: #8B4513;
      color: white;
    }

    .save {
      background: #2e7d32;
      color: white;
    }

    .download {
      background: #1565c0;
      color: white;
    }

    .print {
      background: #555;
      color: white;
    }

    .danger {
      background: #c62828;
      color: white;
    }

    .items {
      margin-top: 15px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
      gap: 10px;
    }

    .item button {
      margin: 0;
      padding: 7px 10px;
    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .actions button {
      margin: 0;
    }

    .quotation-number {
      background: #fff3e0;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .saved {
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .saved strong {
      font-size: 17px;
    }

    .saved-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .saved-actions button {
      margin: 0;
      padding: 8px 11px;
    }

    .details {
      display: none;
      background: #fafafa;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .details.show {
      display: block;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 15px;
    }

    @media (max-width: 600px) {
      .actions {
        grid-template-columns: 1fr;
      }

      .item {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🥐 Kanbulo Bakery</h1>
  <p>Quotation Management</p>
</header>

<main>

  <a class="back" href="index.html">← Dashboard</a>

  <!-- CREATE QUOTATION -->
  <div class="card">

    <h2>📝 Create New Quotation</h2>

    <div class="quotation-number">
      <strong>Quotation No:</strong>
      <span id="quotationNumber"></span>
      <br>
      <strong>Date:</strong>
      <span id="quotationDate"></span>
    </div>

    <label>Customer</label>
    <select id="customer">
      <option value="">Walk-in Customer</option>
    </select>

    <label>Product</label>
    <select id="product">
      <option value="">Select Product</option>
    </select>

    <label>Quantity</label>
    <input id="quantity" type="number" min="1" value="1">

    <button class="primary" onclick="addItem()">➕ Add Product</button>

  </div>

  <!-- CURRENT QUOTATION -->
  <div class="card">

    <h2>📄 Current Quotation</h2>

    <div id="customerDisplay">
      Customer: Walk-in Customer
    </div>

    <div class="items" id="items"></div>

    <div class="total">
      Total: MVR <span id="total">0.00</span>
    </div>

    <div class="actions">
      <button class="save" onclick="saveQuotation()">
        💾 Save Quotation
      </button>

      <button class="download" onclick="saveCurrentQuotationToDevice()">
        📥 Save to Device
      </button>

      <button class="print" onclick="printCurrentQuotation()">
        🖨️ Print
      </button>
    </div>

  </div>

  <!-- SAVED QUOTATIONS -->
  <div class="card">

    <h2>📋 Saved Quotations <span id="savedCount">0</span></h2>

    <div id="savedQuotations"></div>

  </div>

</main>

<script>

const PRODUCTS_KEY = "kanbulo_products";
const CUSTOMERS_KEY = "kanbulo_customers";
const QUOTATIONS_KEY = "kanbulo_quotations";

let items = [];

function getData(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) || fallback;
  } catch {
    return fallback;
  }
}


/* =========================
   LOAD CUSTOMERS
========================= */

function loadCustomers() {

  const customers = getData(CUSTOMERS_KEY, []);
  const select = document.getElementById("customer");

  customers.forEach(customer => {

    const option = document.createElement("option");

    option.value = customer.id;

    option.textContent =
      customer.name +
      (customer.phone ? " - " + customer.phone : "");

    select.appendChild(option);

  });

}


/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts() {

  const products = getData(PRODUCTS_KEY, []);
  const select = document.getElementById("product");

  products.forEach(product => {

    const option = document.createElement("option");

    option.value = product.id;

    option.textContent =
      product.name +
      " — MVR " +
      Number(product.price).toFixed(2) +
      " — Stock: " +
      product.stock;

    select.appendChild(option);

  });

}


/* =========================
   QUOTATION NUMBER
========================= */

function generateQuotationNumber() {

  return "QT-" + Math.floor(100000 + Math.random() * 900000);

}


/* =========================
   DATE
========================= */

function setDate() {

  const now = new Date();

  document.getElementById("quotationNumber").textContent =
    generateQuotationNumber();

  document.getElementById("quotationDate").textContent =
    now.toLocaleString();

}


/* =========================
   ADD ITEM
========================= */

function addItem() {

  const productId =
    Number(document.getElementById("product").value);

  const quantity =
    Number(document.getElementById("quantity").value);

  if (!productId) {
    alert("Please select a product.");
    return;
  }

  if (!quantity || quantity < 1) {
    alert("Please enter a valid quantity.");
    return;
  }

  const products = getData(PRODUCTS_KEY, []);

  const product =
    products.find(p => Number(p.id) === productId);

  if (!product) {
    alert("Product not found.");
    return;
  }

  const existing =
    items.find(item => item.productId === productId);

  if (existing) {

    existing.quantity += quantity;
    existing.total =
      existing.quantity * existing.price;

  } else {

    items.push({

      productId: product.id,
      name: product.name,
      price: Number(product.price),
      quantity: quantity,
      total: Number(product.price) * quantity

    });

  }

  renderItems();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index) {

  items.splice(index, 1);

  renderItems();

}


/* =========================
   RENDER ITEMS
========================= */

function renderItems() {

  const container =
    document.getElementById("items");

  container.innerHTML = "";

  let total = 0;

  if (items.length === 0) {

    container.innerHTML =
      '<div class="empty">No products added yet.</div>';

  }

  items.forEach((item, index) => {

    total += item.total;

    const div = document.createElement("div");

    div.className = "item";

    div.innerHTML = `

      <div>
        <strong>${escapeHTML(item.name)}</strong><br>
        ${item.quantity} × MVR ${item.price.toFixed(2)}
      </div>

      <div>
        <strong>MVR ${item.total.toFixed(2)}</strong>
        <button class="danger"
          onclick="removeItem(${index})">
          ✕
        </button>
      </div>

    `;

    container.appendChild(div);

  });

  document.getElementById("total").textContent =
    total.toFixed(2);

}


/* =========================
   CUSTOMER DISPLAY
========================= */

function updateCustomerDisplay() {

  const customerId =
    Number(document.getElementById("customer").value);

  const customers =
    getData(CUSTOMERS_KEY, []);

  const customer =
    customers.find(c => Number(c.id) === customerId);

  if (customer) {

    document.getElementById("customerDisplay").textContent =
      "Customer: " +
      customer.name +
      (customer.phone ? " — " + customer.phone : "");

  } else {

    document.getElementById("customerDisplay").textContent =
      "Customer: Walk-in Customer";

  }

}

document
  .getElementById("customer")
  .addEventListener("change", updateCustomerDisplay);


/* =========================
   GET CURRENT QUOTATION
========================= */

function getCurrentQuotation() {

  const customerId =
    Number(document.getElementById("customer").value);

  const customers =
    getData(CUSTOMERS_KEY, []);

  const customer =
    customers.find(c => Number(c.id) === customerId);

  const quotationNumber =
    document.getElementById("quotationNumber").textContent;

  const date =
    new Date().toISOString();

  const total =
    items.reduce((sum, item) => sum + item.total, 0);

  return {

    id: Date.now(),

    quotationNumber:
      quotationNumber,

    date:
      date,

    customerId:
      customer ? customer.id : null,

    customerName:
      customer ? customer.name : "Walk-in Customer",

    customerPhone:
      customer ? customer.phone : "",

    items:
      items.map(item => ({

        productId: item.productId,
        name: item.name,
        price: item.price,
        quantity: item.quantity,
        total: item.total

      })),

    total:
      total

  };

}


/* =========================
   SAVE QUOTATION
========================= */

function saveQuotation() {

  if (items.length === 0) {

    alert("Please add at least one product.");

    return;

  }

  const quotation =
    getCurrentQuotation();

  const quotations =
    getData(QUOTATIONS_KEY, []);

  quotations.push(quotation);

  localStorage.setItem(
    QUOTATIONS_KEY,
    JSON.stringify(quotations)
  );

  renderSavedQuotations();

  alert(
    "Quotation " +
    quotation.quotationNumber +
    " saved successfully!"
  );

}


/* =========================
   SAVED QUOTATIONS
========================= */

function renderSavedQuotations() {

  const quotations =
    getData(QUOTATIONS_KEY, []);

  const container =
    document.getElementById("savedQuotations");

  document.getElementById("savedCount").textContent =
    quotations.length;

  container.innerHTML = "";

  if (quotations.length === 0) {

    container.innerHTML =
      '<div class="empty">No saved quotations yet.</div>';

    return;

  }

  quotations
    .slice()
    .reverse()
    .forEach(quotation => {

      const div =
        document.createElement("div");

      div.className = "saved";

      const date =
        new Date(quotation.date).toLocaleString();

      div.innerHTML = `

        <strong>
          ${escapeHTML(quotation.quotationNumber)}
        </strong>

        <br>

        MVR ${Number(quotation.total).toFixed(2)}

        <br>

        ${escapeHTML(quotation.customerName)}

        <br>

        <small>${date}</small>

        <div class="saved-actions">

          <button class="primary"
            onclick="toggleDetails(${quotation.id})">
            👁️ View
          </button>

          <button class="download"
            onclick="downloadQuotationPDF(${quotation.id})">
            📥 Save
          </button>

          <button class="print"
            onclick="printQuotation(${quotation.id})">
            🖨️ Print
          </button>

          <button class="danger"
            onclick="deleteQuotation(${quotation.id})">
            🗑️ Delete
          </button>

        </div>

        <div
          class="details"
          id="details-${quotation.id}">

          ${quotation.items.map(item => `

            <div>
              ${escapeHTML(item.name)}
              × ${item.quantity}
              — MVR ${Number(item.total).toFixed(2)}
            </div>

          `).join("")}

          <hr style="margin:10px 0;">

          <strong>
            Total: MVR
            ${Number(quotation.total).toFixed(2)}
          </strong>

        </div>

      `;

      container.appendChild(div);

    });

}


/* =========================
   VIEW DETAILS
========================= */

function toggleDetails(id) {

  const element =
    document.getElementById("details-" + id);

  element.classList.toggle("show");

}


/* =========================
   DELETE
========================= */

function deleteQuotation(id) {

  if (!confirm("Delete this quotation?")) {
    return;
  }

  let quotations =
    getData(QUOTATIONS_KEY, []);

  quotations =
    quotations.filter(q => q.id !== id);

  localStorage.setItem(
    QUOTATIONS_KEY,
    JSON.stringify(quotations)
  );

  renderSavedQuotations();

}


/* =========================
   PRINT CURRENT
========================= */

function printCurrentQuotation() {

  if (items.length === 0) {

    alert("Please add at least one product.");

    return;

  }

  const quotation =
    getCurrentQuotation();

  printQuotationObject(quotation);

}


/* =========================
   PRINT SAVED
========================= */

function printQuotation(id) {

  const quotations =
    getData(QUOTATIONS_KEY, []);

  const quotation =
    quotations.find(q => q.id === id);

  if (!quotation) return;

  printQuotationObject(quotation);

}


/* =========================
   PRINT FUNCTION
========================= */

function printQuotationObject(quotation) {

  const rows =
    quotation.items.map(item => `

      <tr>
        <td>${escapeHTML(item.name)}</td>
        <td>${item.quantity}</td>
        <td>MVR ${Number(item.price).toFixed(2)}</td>
        <td>MVR ${Number(item.total).toFixed(2)}</td>
      </tr>

    `).join("");

  const html = `

    <!DOCTYPE html>
    <html>

    <head>

      <title>${escapeHTML(quotation.quotationNumber)}</title>

      <style>

        body {
          font-family: Arial;
          padding: 30px;
          color: #333;
        }

        h1 {
          color: #8B4513;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 25px;
        }

        th, td {
          border: 1px solid #ddd;
          padding: 10px;
          text-align: left;
        }

        th {
          background: #f5f5f5;
        }

        .total {
          text-align: right;
          font-size: 20px;
          font-weight: bold;
          margin-top: 20px;
        }

      </style>

    </head>

    <body>

      <h1>🥐 Kanbulo Bakery</h1>

      <h2>QUOTATION</h2>

      <p>
        <strong>Quotation No:</strong>
        ${escapeHTML(quotation.quotationNumber)}
      </p>

      <p>
        <strong>Date:</strong>
        ${new Date(quotation.date).toLocaleString()}
      </p>

      <p>
        <strong>Customer:</strong>
        ${escapeHTML(quotation.customerName)}
      </p>

      ${
        quotation.customerPhone
          ? `<p><strong>Phone:</strong> ${escapeHTML(quotation.customerPhone)}</p>`
          : ""
      }

      <table>

        <tr>
          <th>Product</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
        </tr>

        ${rows}

      </table>

      <div class="total">
        Total: MVR ${Number(quotation.total).toFixed(2)}
      </div>

    </body>

    </html>

  `;

  const win =
    window.open("", "_blank");

  win.document.write(html);

  win.document.close();

  win.focus();

  setTimeout(() => {
    win.print();
  }, 300);

}


/* =========================
   SAVE CURRENT TO DEVICE
========================= */

function saveCurrentQuotationToDevice() {

  if (items.length === 0) {

    alert("Please add at least one product.");

    return;

  }

  const quotation =
    getCurrentQuotation();

  downloadQuotationPDFObject(quotation);

}


/* =========================
   SAVE QUOTATION TO DEVICE
========================= */

function downloadQuotationPDF(id) {

  const quotations =
    getData(QUOTATIONS_KEY, []);

  const quotation =
    quotations.find(q => q.id === id);

  if (!quotation) return;

  downloadQuotationPDFObject(quotation);

}


/* =========================
   CREATE SIMPLE PDF
========================= */

function downloadQuotationPDFObject(quotation) {

  const lines = [];

  lines.push("KANBULO BAKERY");
  lines.push("QUOTATION");
  lines.push("");
  lines.push(
    "Quotation No: " +
    quotation.quotationNumber
  );

  lines.push(
    "Date: " +
    new Date(quotation.date).toLocaleString()
  );

  lines.push(
    "Customer: " +
    quotation.customerName
  );

  if (quotation.customerPhone) {

    lines.push(
      "Phone: " +
      quotation.customerPhone
    );

  }

  lines.push("");
  lines.push("----------------------------------------");
  lines.push("Product              Qty       Total");
  lines.push("----------------------------------------");

  quotation.items.forEach(item => {

    let name =
      String(item.name)
        .replace(/[^\x20-\x7E]/g, "?");

    if (name.length > 20) {
      name = name.substring(0, 20);
    }

    const product =
      name.padEnd(20, " ");

    const qty =
      String(item.quantity).padStart(5, " ");

    const total =
      ("MVR " + Number(item.total).toFixed(2))
        .padStart(14, " ");

    lines.push(
      product + qty + "  " + total
    );

  });

  lines.push("----------------------------------------");

  lines.push(
    "TOTAL: MVR " +
    Number(quotation.total).toFixed(2)
  );

  lines.push("");
  lines.push("Thank you for choosing Kanbulo Bakery!");

  const pdf =
    createSimplePDF(lines);

  const blob =
    new Blob([pdf], {
      type: "application/pdf"
    });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "Kanbulo-Quotation-" +
    quotation.quotationNumber +
    ".pdf";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(() => {

    URL.revokeObjectURL(url);

  }, 1000);

  alert(
    "Quotation saved to your device's Downloads folder."
  );

}


/* =========================
   SIMPLE PDF GENERATOR
========================= */

function createSimplePDF(lines) {

  function escapePDF(text) {

    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/\(/g, "\\(")
      .replace(/\)/g, "\\)");

  }

  let content =
    "BT\n" +
    "/F1 16 Tf\n" +
    "50 780 Td\n";

  lines.forEach((line, index) => {

    const size =
      index === 0 ? 18 : 10;

    content +=
      "/F1 " +
      size +
      " Tf\n";

    content +=
      "(" +
      escapePDF(
        String(line)
          .replace(/[^\x20-\x7E]/g, "?")
      ) +
      ") Tj\n";

    content +=
      "0 -18 Td\n";

  });

  content += "ET";

  const objects = [];

  objects.push(
    "<< /Type /Catalog /Pages 2 0 R >>"
  );

  objects.push(
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>"
  );

  objects.push(
    "<< /Type /Page /Parent 2 0 R " +
    "/MediaBox [0 0 612 792] " +
    "/Resources << /Font << /F1 4 0 R >> >> " +
    "/Contents 5 0 R >>"
  );

  objects.push(
    "<< /Type /Font /Subtype /Type1 " +
    "/BaseFont /Helvetica >>"
  );

  objects.push(
    "<< /Length " +
    content.length +
    " >>\nstream\n" +
    content +
    "\nendstream"
  );

  let pdf =
    "%PDF-1.4\n";

  const offsets = [0];

  objects.forEach((object, index) => {

    offsets[index + 1] =
      pdf.length;

    pdf +=
      (index + 1) +
      " 0 obj\n" +
      object +
      "\nendobj\n";

  });

  const xref =
    pdf.length;

  pdf +=
    "xref\n" +
    "0 " +
    (objects.length + 1) +
    "\n";

  pdf +=
    "0000000000 65535 f \n";

  for (let i = 1; i <= objects.length; i++) {

    pdf +=
      String(offsets[i])
        .padStart(10, "0") +
      " 00000 n \n";

  }

  pdf +=
    "trailer\n" +
    "<< /Size " +
    (objects.length + 1) +
    " /Root 1 0 R >>\n" +
    "startxref\n" +
    xref +
    "\n%%EOF";

  return pdf;

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

loadCustomers();
loadProducts();
setDate();
renderItems();
renderSavedQuotations();
updateCustomerDisplay();

</script>

</body>
</html>
